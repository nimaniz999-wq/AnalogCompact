<style>
/* Concept: modern pop art. A retro sun mascot over a groovy stripe, sticker-round shapes with 3px outlines and hard shadows,

:root{

  --line:#14112b; --sh:#14112b; --on:#14112b; --onc:#ffffff; --dotc:rgba(20,17,43,.12);

  --good:#12803f; --bad:#c9211a; --rad:16px; --rad-s:10px;
  --fd:'Vazirmatn','Vazirmatn',Tahoma,sans-serif; --font:'Vazirmatn',Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f0c24; --surface:#1a1640; --surface2:#262057; --fg:#f4f2ff; --muted:#aaa5d0;
  --line:#f4f2ff; --sh:#4b3fd1; --dotc:rgba(255,255,255,.09); --good:#4ade80; --bad:#ff8077; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0c24; --surface:#1a1640; --surface2:#262057; --fg:#f4f2ff; --muted:#aaa5d0;
  --line:#f4f2ff; --sh:#4b3fd1; --dotc:rgba(255,255,255,.09); --good:#4ade80; --bad:#ff8077; color-scheme:dark}
:root[data-cw="1"]{--a1:#2f4cff;--a2:#ff3b30;--a3:#17c7ee;--a4:#ffd60a;--a5:#ff5fa8;--a7:#12c2a6;--a9:#ff8a1f}
:root[data-cw="2"]{--a1:#ff5fa8;--a2:#7a3cff;--a3:#12c2a6;--a4:#ffd60a;--a5:#ff3b30;--a6:#17c7ee;--a8:#2f4cff}
:root[data-cw="3"]{--a1:#12c2a6;--a2:#ff8a1f;--a3:#ffd60a;--a4:#2f4cff;--a5:#ff3b30;--a7:#9be22d;--a9:#7a3cff}
*{box-sizing:border-box}

  background-image:radial-gradient(circle,var(--dotc) 1.4px,transparent 1.7px);background-size:10px 10px;
  padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

:focus-visible{outline:3px solid var(--a4);outline-offset:2px}

  background-image:radial-gradient(circle,var(--dotc) 1.4px,transparent 1.7px);background-size:10px 10px}

.cup{--can:var(--surface2);--lid:var(--surface);--lab:transparent;--labt:var(--muted)}

/* ===== Cosmic '60s: Peter Max colour blends + Fillmore-poster vibrating pairs + Art Nouveau leaf corners ===== */
:root{--bg:#fff3e6;--surface:#fffaf4;--surface2:#ffe4f1;--fg:#2a1457;--muted:#6d5a9a;--line:#2a1457;--sh:#19d3c5;--on:#2a1457;--onc:#fff;--dotc:transparent;
--a1:#ff3d8b;--a2:#6a3dff;--a3:#ffc933;--a4:#19d3c5;--a5:#ff7eb6;--a6:#a5e32e;--a7:#ff7a1a;--a8:#3b2dbf;--a9:#00a99d;--good:#0d8a4f;--bad:#d4165c;--rad:22px;--fd:'Vazirmatn',Tahoma,sans-serif;--font:'Vazirmatn',Tahoma,sans-serif;--ro:.5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150a3a;--surface:#241357;--surface2:#341c7a;--fg:#fff1fb;--muted:#bda8f0;--line:#ff9ad5;--sh:#6a3dff;--bad:#ff8fb1;--ro:.3}}
:root[data-theme="dark"]{--bg:#150a3a;--surface:#241357;--surface2:#341c7a;--fg:#fff1fb;--muted:#bda8f0;--line:#ff9ad5;--sh:#6a3dff;--bad:#ff8fb1;--ro:.3}
:root[data-cw="1"]{--a1:#19d3c5;--a2:#ff3d8b;--a3:#a5e32e;--a4:#ffc933;--a7:#6a3dff;--a9:#ff7a1a}
:root[data-cw="2"]{--a1:#6a3dff;--a2:#ff7a1a;--a3:#19d3c5;--a4:#ff3d8b;--a6:#ffc933}
:root[data-cw="3"]{--a1:#ffc933;--a2:#3b2dbf;--a3:#ff3d8b;--a4:#a5e32e;--a7:#19d3c5;--a5:#ff7a1a}
html{background:var(--bg)}
html::before,html::after{content:"";position:fixed;z-index:-1;pointer-events:none;opacity:var(--ro);width:100vmax;height:100vmax}
html::before{top:0;right:0;background:repeating-radial-gradient(circle at 100% 0,#ff3d8b 0 24px,#ff7a1a 24px 48px,#ffc933 48px 72px,#a5e32e 72px 96px,#19d3c5 96px 120px,#6a3dff 120px 144px);-webkit-mask-image:radial-gradient(circle at 100% 0,#000,transparent 42%);mask-image:radial-gradient(circle at 100% 0,#000,transparent 42%)}
html::after{bottom:0;left:0;background:repeating-radial-gradient(circle at 0 100%,#6a3dff 0 24px,#19d3c5 24px 48px,#a5e32e 48px 72px,#ffc933 72px 96px,#ff7a1a 96px 120px,#ff3d8b 120px 144px);-webkit-mask-image:radial-gradient(circle at 0 100%,#000,transparent 42%);mask-image:radial-gradient(circle at 0 100%,#000,transparent 42%)}
body{background:transparent;background-image:none;font-weight:500}
header.top{background:color-mix(in srgb,var(--bg) 80%,transparent);background-image:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
@keyframes flow{to{background-position:200% 0}}
.logo{font:900 2.8rem/1.3 var(--fd);background:linear-gradient(90deg,#ff3d8b,#ff7a1a,#ffc933,#a5e32e,#19d3c5,#6a3dff,#ff3d8b) 0 0/200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(2px 2px 0 var(--line));animation:flow 6s linear infinite}
.stripes{height:16px;border:0;border-radius:99px;box-shadow:0 0 0 3px var(--line);background:linear-gradient(90deg,#ff3d8b,#ff7a1a,#ffc933,#a5e32e,#19d3c5,#6a3dff,#ff3d8b) 0 0/200% 100%;animation:flow 8s linear infinite}
h2{font:900 1.05rem/1.7 var(--fd);background:linear-gradient(90deg,var(--a3),var(--a7))}
.tabs button{font:800 1rem var(--fd);padding:2px 18px}
.tabs button[aria-selected="true"]{background:linear-gradient(135deg,var(--a1),var(--a7));box-shadow:3px 3px 0 var(--a4)}
.btn{font-family:var(--fd);font-weight:800}
.btn.primary{background:linear-gradient(135deg,var(--a1),var(--a2))}
.tools .btn{font:800 1.05rem var(--fd);padding:3px 22px}
.card,.form{border-radius:34px 12px 34px 12px}
.wcol,.cell,.meal{border-radius:26px 10px 26px 10px}
.win{border-radius:34px 12px 34px 12px;background-image:linear-gradient(160deg,var(--surface2),var(--bg))}
.modal{background:rgba(42,20,87,.62);backdrop-filter:blur(4px)}
.task{border-radius:28px 10px 28px 10px;background:linear-gradient(120deg,var(--c),color-mix(in srgb,var(--c) 72%,#fff))}
.task::before{width:100%;background:radial-gradient(circle at 0 0,rgba(255,255,255,.5),transparent 55%);-webkit-mask-image:none;mask-image:none}
.task .tx b{font-weight:800}
.stamp.ok{background:var(--a6);color:#2a1457}
.hour .t{font:800 .95rem var(--fd)}
.ticker{background:linear-gradient(90deg,var(--a8),var(--a2),var(--a1),var(--a8)) 0 0/200% 100%;animation:flow 10s linear infinite;font:700 1rem/1.9 var(--fd)}
.ticker div{animation:tick 40s linear infinite}
.bst b{font:900 .95rem/1.15 var(--fd)}
.bst svg{filter:drop-shadow(3px 3px 0 var(--line))}
.cup .cb{stroke-width:3}.cup .ct{font:800 8px var(--fd)}
.cup .hl{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;opacity:.85}
.bar i{background:linear-gradient(90deg,var(--a4),var(--a2),var(--a1))}
.facts h3,.ycard header h2{font:900 1.2rem/1.3 var(--fd)}
.mh,.wcol h3,.meal label,.rchip,.cell strong{font-family:var(--fd);font-weight:800}
.cell.today{background-color:var(--a7)}
.cell.today strong{background:var(--a4);color:var(--on)}
.gi{padding:8px 0;border-top:2px dashed var(--line)}.gi:first-of-type{border-top:0}.gi .bar{margin-top:6px;height:12px}
.brush{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.bb{font:800 .9rem var(--fd);display:flex;align-items:center;gap:6px;background:var(--surface);border:3px solid var(--line);border-radius:99px;padding:2px 14px;box-shadow:3px 3px 0 var(--sh)}
.bb span{font-size:1.3rem;filter:grayscale(1) opacity(.45)}
.bb[aria-pressed="true"]{background:linear-gradient(135deg,var(--a4),var(--a6))}.bb[aria-pressed="true"] span{filter:none}
.al{font-size:.78rem;font-weight:700;padding:2px 8px;margin-bottom:5px;border-radius:12px 4px 12px 4px;border:2px solid var(--line);background:var(--a3);color:var(--on)}
.al.birthday{background:var(--a5)}.al.special{background:var(--a6)}
.alerts{display:grid;gap:6px;margin-top:12px}.alerts .al{font-size:.95rem;margin:0}
.modes{display:flex;gap:8px;margin-bottom:12px}.modes .btn[aria-pressed="true"]{background:linear-gradient(135deg,var(--a1),var(--a7));color:var(--onc)}
body.sch .task{opacity:.5;filter:saturate(.45)}
body.sch [data-act="done"],body.sch [data-act="skip"],body.sch .stamp{display:none}
.ghost{display:flex;align-items:center;justify-content:space-between;gap:6px;border:2px dashed var(--c);border-radius:14px 4px 14px 4px;padding:2px 10px;margin-bottom:5px;font-size:.8rem;font-weight:600;color:var(--muted);background:color-mix(in srgb,var(--c) 10%,transparent);opacity:.6}
.ghost .ic{width:26px;height:26px;font-size:.8rem}
textarea.field{width:100%;margin:8px 0;font:.8rem monospace}
.tl{position:relative;margin-top:8px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,color-mix(in srgb,var(--line) 12%,transparent) 35px,color-mix(in srgb,var(--line) 12%,transparent) 36px,transparent 36px,transparent 72px)}
.slot{position:absolute;inset-inline:0;z-index:0;background:none;border:0;border-top:2px dashed var(--line);border-radius:0;box-shadow:none;transform:none;padding:0;text-align:start;cursor:pointer}
.slot:hover{background:color-mix(in srgb,var(--a3) 22%,transparent)}
.slot .hl{position:absolute;inset-inline-start:0;top:2px;width:60px;font:800 .85rem var(--fd);color:var(--muted)}
.bkm{position:absolute;top:0;bottom:0;inset-inline-start:64px;pointer-events:none}
.bkg{position:absolute;top:0;bottom:0;inset-inline-end:0;width:30%;pointer-events:none}
.blk{position:absolute;z-index:2;cursor:pointer;pointer-events:auto}
.blk .task{height:100%;margin:0;min-height:0;overflow:hidden;padding:2px 8px;align-items:flex-start;gap:4px}
.blk .tx{min-width:0;overflow:hidden}.blk .tm{font-size:.75rem}
.blk .row{flex-wrap:wrap;justify-content:flex-end;gap:2px}
.blk .ic{width:24px;height:24px;font-size:.75rem}
.blk.s .tm,.blk.s .stk,.blk.s .stamp{display:none}
.blk.s .task{padding:0 8px;align-items:center}.blk.s .row{flex-wrap:nowrap}
.blk.s .tx b{font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.blk.gz{z-index:1;cursor:default}.blk.gz .ghost{height:100%;margin:0;overflow:hidden;align-items:flex-start;padding:2px 8px;font-size:.75rem}
.nowl{position:absolute;inset-inline:0;border-top:3px solid var(--a1);z-index:4;pointer-events:none}
.nowl .now{position:absolute;inset-inline-start:10px;top:-20px;width:36px}
.brand{margin:0;display:flex;align-items:center}
.brand img{height:88px;width:auto;max-width:100%;cursor:pointer;user-select:none;-webkit-user-drag:none;border-radius:18px}
@media(max-width:480px){.brand img{height:66px}}
.brand img{background:#fff1dc;padding:4px 14px;border:3px solid var(--line);border-radius:22px;box-shadow:3px 3px 0 var(--sh)}
#splash{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;cursor:pointer;background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--a3) 35%,transparent),transparent 55%),var(--bg);transition:opacity .55s;-webkit-tap-highlight-color:transparent}
#splash .sun{width:min(56vmin,320px);height:auto;filter:drop-shadow(0 0 28px rgba(255,201,51,.6));animation:spl 2.4s ease-in-out infinite}
#splash .sun .rays{animation-duration:14s}
#splash:focus{outline:none}#splash:focus-visible .sun{outline:3px solid var(--a4);border-radius:50%}
#splash.go{opacity:0;pointer-events:none}
#splash.go .sun{animation:none;transform:scale(2.2) rotate(40deg);transition:transform .6s}
@keyframes spl{50%{transform:scale(1.06)}}
</style>

      <button role="tab" data-v="week" aria-selected="false">هفتگی</button>
      <button role="tab" data-v="month" aria-selected="false">ماهانه</button>
      <button role="tab" data-v="year" aria-selected="false">سالانه</button>
      <button role="tab" data-v="routine" aria-selected="false">روتین</button>
    </div>
    <div class="row spread" style="margin-top:12px">
      <div class="row">
        <button class="btn sm" id="prev" aria-label="قبلی">▶</button>
        <span class="cap" id="dateLabel"></span>
        <button class="btn sm" id="next" aria-label="بعدی">◀</button>
        <button class="btn sm" id="goToday">امروز</button>
      </div>
      <span class="muted" id="saveState"></span>
    </div>
    <div class="stripes"></div>
  </header>
  <div class="ticker" id="ticker" aria-hidden="true"></div>
  <main id="main"></main>
</div>
<script>
const COLORS=['#ff3d8b','#ff5a5f','#ff7a1a','#ffa51f','#ffc933','#d6e83a','#a5e32e','#3ccf6a','#00a99d','#19d3c5','#2fb8ff','#4f7bff','#3b2dbf','#6a3dff','#9a4dff','#c14dff','#ff4fd8','#ff7eb6','#ffb0d0','#ff8f6b','#a0522d','#2a1457','#6d5a9a','#c9bff0'];
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WD=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const MEALS=[['b','صبحانه'],['l','ناهار'],['d','شام'],['s','میان‌وعده'],['x','موارد اضافه']];
const CUPS=12; // 12 cups x 250 ml = 3 L
const $=s=>document.querySelector(s);
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const rid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const textOn=c=>{const h=String(c).replace('#','');const n=parseInt(h.length===3?h.replace(/./g,'$&$&'):h,16);
  const f=v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)};
  const L=0.2126*f(n>>16&255)+0.7152*f(n>>8&255)+0.0722*f(n&255);
  return (L+0.05)/(0.0053+0.05)>=(1.05)/(L+0.05)?'#10131a':'#ffffff'};
const STAR=Array.from({length:96},(_,i)=>{const a=Math.PI*i/48,r=38+10*Math.cos(a*8);return(50+r*Math.cos(a)).toFixed(1)+','+(50+r*Math.sin(a)).toFixed(1)}).join(' ');
const burst=(txt,style='')=>`<span class="bst" style="${style}"><svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="${STAR}"/></svg><b>${txt}</b></span>`;
function celebrate(text){
  const el=document.createElement('div');el.className='cele';el.setAttribute('role','status');
  const cols=['var(--a1)','var(--a2)','var(--a3)','var(--a4)','var(--a5)'];let dots='';
  for(let i=0;i<24;i++){const a=Math.random()*6.283,r=130+Math.random()*190,z=10+Math.random()*16;
    dots+=`<i class="dt" style="width:${z}px;height:${z}px;background:${cols[i%5]};--x:${(Math.cos(a)*r).toFixed(0)}px;--y:${(Math.sin(a)*r).toFixed(0)}px"></i>`}
  el.innerHTML=dots+burst(text);document.body.appendChild(el);setTimeout(()=>el.remove(),2300);
}

// Original retro pop-art sun mascot: sunglasses on by default, eyes open when every task of the day is done.
function sunSvg(glasses){
  const cs=['--a1','--a7','--a3','--a6','--a4','--a2'];let p='';
  for(let i=0;i<12;i++)p+=`<ellipse cx="60" cy="17" rx="9" ry="16" transform="rotate(${i*30} 60 60)" fill="var(${cs[i%6]})" stroke="var(--line)" stroke-width="2.5"/>`;
  const face=glasses
   ?`<circle cx="45" cy="55" r="11" fill="var(--a5)" fill-opacity=".8" stroke="var(--line)" stroke-width="3"/><circle cx="75" cy="55" r="11" fill="var(--a5)" fill-opacity=".8" stroke="var(--line)" stroke-width="3"/><path d="M56 54h8" stroke="var(--line)" stroke-width="3"/><path d="M39 50q3-3 7-3" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/>`
   :`<circle cx="45" cy="55" r="7" fill="#fff" stroke="var(--line)" stroke-width="3"/><circle cx="75" cy="55" r="7" fill="#fff" stroke="var(--line)" stroke-width="3"/><circle cx="46" cy="56" r="3" fill="var(--line)"/><circle cx="76" cy="56" r="3" fill="var(--line)"/>`;
  return`<svg class="sun" viewBox="0 0 120 120" aria-hidden="true"><g class="rays">${p}</g><circle cx="60" cy="60" r="32" fill="var(--a3)" stroke="var(--line)" stroke-width="3.5"/><circle cx="37" cy="72" r="5" fill="var(--a1)" fill-opacity=".7"/><circle cx="83" cy="72" r="5" fill="var(--a1)" fill-opacity=".7"/>${face}<path d="M45 76q15 13 30 0" fill="none" stroke="var(--line)" stroke-width="3.5" stroke-linecap="round"/></svg>`;
}
let CW=0;try{CW=(+localStorage.getItem('planner-cw'))||0}catch(e){}
const applyCW=()=>document.documentElement.setAttribute('data-cw',String(CW));applyCW();


// Calendar starts as the Persian calendar for 1405; every number can be changed in the settings panel.
let S={
  cfg:{year:1405,leap:false,months:MN.map((n,i)=>({name:n,days:i<6?31:i<11?30:29})),today:{m:7,d:23,wd:0}},
  days:{},routines:[]
};
let V={v:'day',m:7,d:23,form:null,showSet:false,modal:null,rid:null,rp:null,glasses:true};

const total=()=>S.cfg.months.reduce((a,x)=>a+x.days,0);
const idx=(m,d)=>{let s=0;for(let i=0;i<m;i++)s+=S.cfg.months[i].days;return s+d-1};
function fromIdx(i){let m=0;while(m<11&&i>=S.cfg.months[m].days){i-=S.cfg.months[m].days;m++}return{m,d:i+1}}
const wdOf=(m,d)=>{const t=S.cfg.today;return(((t.wd+idx(m,d)-idx(t.m,t.d))%7)+7)%7};
const key=(m,d)=>m+'-'+d;
const EMPTY={tasks:[],meals:{},water:0};
const wrapS=o=>V.sch?new Proxy(o,{get:(t,k)=>k==='tasks'?(t.sched||(t===EMPTY?[]:(t.sched=[]))):t[k],set:(t,k,v)=>{t[k==='tasks'?'sched':k]=v;return true}}):o;
const dayOf=(m,d)=>wrapS(S.days[key(m,d)]||EMPTY);
function ensure(m,d){const k=key(m,d);return wrapS(S.days[k]||(S.days[k]={tasks:[],meals:{},water:0}))}
function clampView(){
  const mm=S.cfg.months;
  if(V.m>11)V.m=11; if(V.m<0)V.m=0;
  if(V.d>mm[V.m].days)V.d=mm[V.m].days; if(V.d<1)V.d=1;
}

/* ---- saving: this browser always, the viewer's private store when signed in ---- */
let col=null,saving=false,timer=null;const pend=new Set();
const setState=t=>{const e=$('#saveState');if(e)e.textContent=t};
const lsSave=()=>{try{localStorage.setItem('planner-v1',JSON.stringify(S))}catch(e){}};
const lsLoad=()=>{try{const t=localStorage.getItem('planner-v1');return t?JSON.parse(t):null}catch(e){return null}};
const monthDays=m=>{const o={};for(const k in S.days)if(k.split('-')[0]==String(m))o[k]=S.days[k];return o};
function touch(n){
  lsSave();pend.add(n==='cfg'?'cfg':'m'+n);setState('در حال ذخیره…');
  clearTimeout(timer);timer=setTimeout(flush,700);
}
async function flush(){
  if(!col){pend.clear();setState('ذخیره در همین مرورگر');return}
  if(saving)return;
  saving=true;
  try{
    while(pend.size){
      const n=[...pend][0];pend.delete(n);
      const body=n==='cfg'?{cfg:S.cfg,routines:S.routines,goals:S.goals,events:S.events}:monthDays(+n.slice(1));
      await col.doc(n).set({j:JSON.stringify(body)});
    }
    setState('ذخیره شد');
  }catch(e){setState('ذخیره در حساب ممکن نشد؛ در این مرورگر ذخیره است')}
  saving=false;if(pend.size)flush();
}
async function boot(){
  const local=lsLoad();
  if(local&&local.cfg){S=Object.assign(S,local);V.m=S.cfg.today.m;V.d=S.cfg.today.d}
  render();
  try{
    if(!(window.claude&&claude.use)){setState('ذخیره در همین مرورگر');return}
    const [user,db]=await Promise.all([claude.use('user'),claude.use('db')]);
    const uid=user?await user.id():null;
    if(!db||!uid){setState('ذخیره در همین مرورگر');return}
    col=db.collection('data/users/'+uid);
    const snap=await Promise.race([col.get(),new Promise((_,r)=>setTimeout(()=>r(0),10000))]);
    if(snap.size){
      const days={};
      for(const d of snap.docs){
        const j=JSON.parse(d.data().j);
        if(d.id==='cfg'){S.cfg=j.cfg;S.routines=j.routines||[];S.goals=j.goals||[];S.events=j.events||[]}else Object.assign(days,j);
      }
      S.days=days;lsSave();setState('ذخیره شد');
    }else{
      touch('cfg');for(let m=0;m<12;m++)if(Object.keys(monthDays(m)).length)touch(m);
    }
  }catch(e){col=null;setState('ذخیره در همین مرورگر')}
  clampView();render();
}
</script>
<script>
const hhmm=s=>fa(s);
const toMin=s=>{const[a,b]=s.split(':').map(Number);return a*60+b};
const fromMin=n=>{n=Math.max(0,Math.min(1439,n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};
const sorted=a=>a.slice().sort((x,y)=>toMin(x.start)-toMin(y.start));
const dateName=(m,d)=>fa(d)+' '+S.cfg.months[m].name;

function swatches(sel){
  return COLORS.map(c=>`<button type="button" data-act="color" data-c="${c}" style="--c:${c}" aria-label="رنگ" aria-pressed="${c===sel}"></button>`).join('')
    +`<input type="color" data-cp="task" value="${/^#[0-9a-f]{6}$/i.test(sel)?sel:'#ff3b30'}" aria-label="رنگ دلخواه">`;
}
function formHtml(){
  const f=V.form;if(!f)return'';
  return`<div class="form" id="taskForm">
    <input id="f-text" placeholder="چه کاری؟ مثلاً مطالعه، ورزش، جلسه…" value="${esc(f.text)}" maxlength="200">
    <div class="row"><label>از <input type="time" id="f-start" value="${f.start}" style="width:auto"></label>
      <label>تا <input type="time" id="f-end" value="${f.end}" style="width:auto"></label></div>
    <div class="sw" id="f-colors">${swatches(f.color)}</div>
    <label class="row"><input type="checkbox" id="f-star" style="width:auto" ${f.star?'checked':''}> مهم است (ستاره‌دار)</label>
    <div class="row"><button class="btn primary" data-act="saveTask">ذخیره</button>
      ${f.id?'':`<button class="btn" style="background:var(--a8);color:var(--onc)" data-act="toggleRP" aria-expanded="${!!V.rp}">روتین</button>`}
      <button class="btn" data-act="cancelTask">انصراف</button></div>
    ${f.id?'':rpHtml()}
  </div>`;
}
const STK=[['ورزش','پوف!'],['مطالعه','هوم…'],['کتاب','هوم…'],['خواب','زززز'],['استراحت','آخیش!'],['چای','آخیش!'],['قهوه','آخیش!'],['غذا','نوش جان!']];
function taskHtml(t){
  const st=t.status||'',stk=STK.find(([k])=>t.text.includes(k));
  return`<div class="task ${st}" style="--c:${t.color};--tc:${textOn(t.color)}">
    <div class="tx"><b>${esc(t.text)}</b>${st==='done'?'<span class="stamp ok">انجام شد!</span>':st==='skip'?'<span class="stamp no">نشد!</span>':''}${stk?`<span class="stk">${stk[1]}</span>`:''}
      <div class="tm">${hhmm(t.start)} تا ${hhmm(t.end)}${t.r?' · روتین: '+esc(t.r):''}</div></div>
    <div class="row" style="gap:4px;flex:none">
      <button class="ic ${st==='done'?'on-done':''}" data-act="done" data-id="${t.id}" aria-label="انجام شد" title="انجام شد">✓</button>
      <button class="ic ${st==='skip'?'on-skip':''}" data-act="skip" data-id="${t.id}" aria-label="انجام نشد" title="انجام نشد">✕</button>
      <button class="ic star ${t.star?'on':''}" data-act="star" data-id="${t.id}" aria-label="مهم" title="مهم">★</button>
      <button class="ic" data-act="edit" data-id="${t.id}" aria-label="ویرایش" title="ویرایش">✎</button>
      <button class="ic" data-act="del" data-id="${t.id}" aria-label="حذف" title="حذف">🗑</button>
    </div></div>`;
}
const litres=w=>((w*0.25).toFixed(2).replace(/\.?0+$/,'').replace('.','٫'))||'0';
const rTotal=r=>r.steps.reduce((a,s)=>a+(+s.min||0),0);
const totalText=r=>{const t=rTotal(r),h=Math.floor(t/60),m=t%60;return'مجموع: '+fa(t)+' دقیقه'+(h?' ('+fa(h)+' ساعت'+(m?' و '+fa(m)+' دقیقه':'')+')':'')};
// A routine is written in minutes. Applied to a day, its steps are laid back to back from the start time you choose;
// each step can be left out or have its minutes changed first.
const stepMin=(p,s)=>Math.max(1,+(p.mins[s.id]??s.min)||1);
function rpSchedule(){
  const p=V.rp,r=S.routines.find(x=>x.id===p.id)||S.routines[0],out=[];let cur=toMin(p.start);
  for(const s of r.steps){
    if(p.skip[s.id])continue;
    const m=stepMin(p,s);if(cur>=1439)break;
    out.push({a:cur,b:Math.min(1439,cur+m),text:(s.text||'').trim()||'مرحله'});cur+=m;
  }
  return{r,out};
}
function rpUpdate(){
  const p=V.rp,r=p&&S.routines.find(x=>x.id===p.id);if(!r)return;
  let cur=toMin(p.start),n=0,sum=0;
  for(const s of r.steps){
    const el=document.querySelector('[data-pt="'+s.id+'"]');
    if(p.skip[s.id]){if(el)el.textContent='—';continue}
    const m=stepMin(p,s),a=cur,b=Math.min(1439,cur+m);
    if(el)el.textContent=a>=1439?'خارج از روز':hhmm(fromMin(a))+' تا '+hhmm(fromMin(b));
    cur+=m;sum+=m;n++;
  }
  const t=$('#rpTot');if(t)t.textContent=fa(n)+' مرحله · '+fa(sum)+' دقیقه · پایان '+hhmm(fromMin(Math.min(1439,cur)));
}
function rpHtml(){
  const p=V.rp;if(!p)return'';
  if(!S.routines.length)return`<div class="rpx"><div class="muted">هنوز روتینی نساخته‌ای. از تب «روتین» یکی بساز و برگرد.</div></div>`;
  const r=S.routines.find(x=>x.id===p.id)||S.routines[0];
  const chips=S.routines.map(x=>`<button type="button" class="rchip" style="--c:${x.color};--tc:${textOn(x.color)};width:auto;margin:0" data-act="pickR" data-id="${x.id}" aria-pressed="${x.id===r.id}">${esc(x.name)}</button>`).join('');
  const rows=r.steps.map(s=>`<div class="srow"><input type="checkbox" data-rp="inc" data-id="${s.id}" ${p.skip[s.id]?'':'checked'} aria-label="شامل شود">
    <span class="pt" data-pt="${s.id}"></span><span class="tx2">${esc(s.text||'مرحله')}</span>
    <input type="number" min="1" class="field" data-rp="min" data-id="${s.id}" value="${p.mins[s.id]??s.min}" aria-label="دقیقه"><span class="muted">دقیقه</span></div>`).join('');
  return`<div class="rpx" id="rpx"><div class="row" style="margin-bottom:8px">${chips}</div>
    <label class="row">شروع از <input type="time" class="field" data-rp="start" value="${p.start}" style="width:auto"></label>
    <div style="margin:8px 0">${rows||'<span class="muted">این روتین هنوز مرحله‌ای ندارد.</span>'}</div>
    <div class="muted" id="rpTot"></div>
    <div class="row" style="margin-top:8px"><button type="button" class="btn primary" data-act="applyRP">پیاده‌سازی روتین در برنامه‌ی این روز</button></div></div>`;
}
function dayHtml(){
  const day=dayOf(V.m,V.d),tasks=sorted(day.tasks);
  const nowH=new Date().getHours(),isT=(V.m===S.cfg.today.m&&V.d===S.cfg.today.d);
  let rows='';
  for(let h=0;h<24;h++){
    const here=tasks.filter(t=>Math.floor(toMin(t.start)/60)===h).map(t=>taskHtml(t)).join('');
    rows+=`<div class="hour"><div class="t"><span>${fa(String(h).padStart(2,'0'))}:${fa('00')}</span>${isT&&h===nowH?`<span class="now" title="الان">${sunSvg(true)}</span>`:''}</div>
      <div>${here}<button class="add" data-act="add" data-h="${h}" aria-label="افزودن برنامه ساعت ${fa(h)}">${here?'＋':'＋ برنامه'}</button></div></div>`;
  }
  const done=day.tasks.filter(t=>t.status==='done').length;
  return`<div class="tools">
    <button class="btn" data-act="openModal" data-w="meals">غذا</button>
    <button class="btn" data-act="openModal" data-w="water">آب · ${fa(litres(day.water||0))} از ${fa(3)} لیتر</button></div>
    <section class="card" style="margin-top:14px"><div class="row spread"><h2>برنامه‌ی ساعتی</h2>
      <span class="muted">${fa(done)} از ${fa(day.tasks.length)} کار انجام شد</span></div>
      ${formHtml()}${rows}</section>${modalHtml(day)}`;
}
function modalHtml(day){
  if(!V.modal)return'';
  const meals=V.modal==='meals';
  return`<div class="modal" data-act="closeModal"><div class="win" role="dialog" aria-modal="true" aria-label="${meals?'غذا':'آب'}">
    <div class="row spread" style="margin-bottom:8px"><h2 style="margin:0">${meals?'غذای امروز':'آب امروز'}</h2><button class="btn sm" data-act="closeModal">بستن</button></div>
    ${meals?mealsHtml(day):waterHtml(day)}</div></div>`;
}
function routinesHtml(){
  if(!S.routines.find(r=>r.id===V.rid))V.rid=S.routines[0]?S.routines[0].id:null;
  const list=S.routines.map(r=>`<button class="rchip" style="--c:${r.color};--tc:${textOn(r.color)}" data-act="selR" data-id="${r.id}" aria-pressed="${r.id===V.rid}">
    <b data-chipname="${r.id}">${esc(r.name)}</b><span class="muted" data-chipmin="${r.id}">${fa(rTotal(r))} دقیقه</span></button>`).join('');
  const r=S.routines.find(x=>x.id===V.rid);
  let ed='<div class="muted">یک روتین جدید بساز تا مرحله‌هایش را بنویسی.</div>';
  if(r){
    const sw=COLORS.map(c=>`<button type="button" data-act="rcolor" data-c="${c}" style="--c:${c}" aria-label="رنگ" aria-pressed="${c===r.color}"></button>`).join('')+
      `<input type="color" data-cp="routine" value="${/^#[0-9a-f]{6}$/i.test(r.color)?r.color:'#ff3b30'}" aria-label="رنگ دلخواه">`;
    const steps=r.steps.map(s=>`<div class="step"><input data-s="text" data-id="${s.id}" value="${esc(s.text)}" placeholder="مثلاً مسواک زدن" aria-label="کار">
      <input type="number" min="1" data-s="min" data-id="${s.id}" value="${s.min}" aria-label="دقیقه"><button class="ic" data-act="delS" data-id="${s.id}" aria-label="حذف مرحله">×</button></div>`).join('');
    ed=`<div style="display:grid;gap:10px"><input class="field" data-r="name" value="${esc(r.name)}" aria-label="نام روتین" maxlength="60">
      <div class="sw">${sw}</div>
      <h2 style="margin:6px 0 0;width:fit-content">مرحله‌ها (به دقیقه)</h2>${steps}
      <div><button class="btn sm" data-act="addS">＋ مرحله</button></div>
      <div class="muted" id="rTotal">${totalText(r)}</div>
      <div><button class="btn danger sm" data-act="delR">حذف این روتین</button></div></div>`;
  }
  return`<div class="rl"><section class="card"><div class="row spread" style="margin-bottom:8px"><h2 style="margin:0">روتین‌ها</h2><button class="btn primary sm" data-act="newR">＋ روتین جدید</button></div>
    ${list||'<div class="muted">هنوز روتینی نیست.</div>'}</section><section class="card">${ed}</section></div>`;
}
const MC=[['var(--a4)','var(--on)'],['var(--a1)','var(--onc)'],['var(--a2)','var(--onc)'],['var(--a3)','var(--on)'],['var(--a5)','var(--on)']];
const MEAL_Q=['امروز چی خوردی؟ راست بگو!','شکمت صدا می‌کنه؟','بوی غذا تا اینجا اومد…','نکنه میان‌وعده یادت رفته؟'];
function mealsHtml(day){
  return`<div class="bubble">${MEAL_Q[V.d%4]}</div>`+MEALS.map(([k,n],i)=>

// An original tin can; every filled can swaps colourways (repetition with colour changes, a pop art habit).
const canSvg=()=>`<svg viewBox="0 0 40 44" aria-hidden="true"><circle class="cb" cx="20" cy="22" r="17"/><ellipse class="ca" cx="20" cy="22" rx="17" ry="6"/><path class="hl" d="M9 14q3-6 9-8"/><text class="ct" x="20" y="25" text-anchor="middle">آب</text></svg>`;

<script>
const HC=[['var(--a1)','var(--onc)'],['var(--a2)','var(--onc)'],['var(--a3)','var(--on)'],['var(--a4)','var(--on)'],['var(--a5)','var(--on)'],['var(--a6)','var(--on)'],['var(--a7)','var(--on)'],['var(--a8)','var(--onc)'],['var(--a9)','var(--on)']];
function weekHtml(){
  const start=idx(V.m,V.d)-wdOf(V.m,V.d),cols=[];
  for(let i=0;i<7;i++){
    const j=start+i,hc=HC[i%HC.length];
    if(j<0||j>=total()){cols.push(`<div class="wcol" style="opacity:.55"><h3 style="--hc:${hc[0]};--ht:${hc[1]}">${WD[i]}</h3><div class="muted">پایان داستان؟ این روز خارج از سال است.</div></div>`);continue}
    const{m,d}=fromIdx(j),day=dayOf(m,d),sel=(m===V.m&&d===V.d);
    const items=sorted(day.tasks).map(t=>`<div class="mini ${t.status||''}" style="--c:${t.color};--tc:${textOn(t.color)}">
      <span><b class="tm">${hhmm(t.start)}</b> ${esc(t.text)}</span>
      <button data-act="wstar" data-m="${m}" data-d="${d}" data-id="${t.id}" aria-label="مهم">${t.star?'★':'☆'}</button></div>`).join('');
    const done=day.tasks.filter(t=>t.status==='done').length;
    cols.push(`<div class="wcol ${sel?'sel':''}"><h3 style="--hc:${hc[0]};--ht:${hc[1]}" data-act="goday" data-m="${m}" data-d="${d}">${WD[i]} ${dateName(m,d)}</h3>
      ${alertsHtml(m,d)}${items||'<div class="muted">بدون برنامه</div>'}
      <div class="muted" style="margin-top:6px">${fa(done)}/${fa(day.tasks.length)} انجام شد · آب ${fa(litres(day.water||0))} لیتر</div></div>`);
  }
  return`<div class="week">${cols.join('')}</div><div class="note">روی ☆ بزن تا کار برای صفحه‌ی سالانه ستاره‌دار شود.</div>`+goalsHtml('w');
}
// Dot size in a day cell grows with the number of tasks: a halftone heat map.
function monthHtml(){
  const n=S.cfg.months[V.m].days,off=wdOf(V.m,1),t=S.cfg.today;
  let h=WD.map(w=>`<div class="mh">${w}</div>`).join('');
  for(let i=0;i<off;i++)h+='<div class="cell empty"></div>';
  for(let d=1;d<=n;d++){
    const day=dayOf(V.m,d),c=day.tasks.length,stars=day.tasks.filter(x=>x.star).length,isT=(t.m===V.m&&t.d===d);
    const r=c?Math.min(3.2,0.7+c*0.5).toFixed(1):0;
    h+=`<button class="cell ${isT?'today':''}" style="--r:${r}px" data-act="goday" data-m="${V.m}" data-d="${d}">
      <strong>${fa(d)}</strong>
      ${c?`<small>${fa(c)} کار${stars?' · '+fa(stars)+'★':''}</small>`:'<span></span>'}
      ${day.water?`<small>آب ${fa(litres(day.water))} لیتر</small>`:''}${evMark(V.m,d)}</button>`;
  }
  return`<div class="month">${h}</div><div class="note">هرچه نقطه‌های هر روز درشت‌تر باشد، آن روز شلوغ‌تر است.</div>`+goalsHtml('m')+eventsHtml()+backupHtml();
}
function yearHtml(){
  return`<div class="year">`+S.cfg.months.map((mo,m)=>{
    const li=[],hc=HC[m%HC.length];
    for(let d=1;d<=mo.days;d++)for(const t of sorted(dayOf(m,d).tasks))if(t.star)
      li.push(`<li><button class="btn sm" style="margin-inline-end:6px" data-act="goday" data-m="${m}" data-d="${d}">${fa(d)}</button>${esc(t.text)}${t.status==='done'?' ✓':t.status==='skip'?' ✕':''}</li>`);
    return`<section class="card ycard"><header style="--yc:${hc[0]};--yt:${hc[1]}"><h2>${esc(mo.name)}</h2>${li.length?burst(fa(li.length)+'★','--w:52px;--bf:var(--surface);--bt:var(--fg)'):`<span class="muted" style="color:inherit">${fa(mo.days)} روز</span>`}</header>
      <div class="body">${li.length?`<ul class="ylist">${li.join('')}</ul>`:'<div class="muted">کار ستاره‌دار ندارد.</div>'}</div></section>`;
  }).join('')+`</div>`+goalsHtml('y')+eventsHtml()+backupHtml();
}
function settingsHtml(){
  const c=S.cfg,t=c.today;
  return`<section class="card" style="margin-top:16px"><div class="row spread"><h2>تنظیم تقویم</h2><button class="btn primary" data-act="closeSet">بازگشت به برنامه</button></div>
    <p class="muted">تعداد روزهای هر ماه، کبیسه بودن سال و تاریخ امروز را خودت تعیین می‌کنی. هیچ تاریخی خودکار حدس زده نمی‌شود.</p>
    <div class="set" style="margin-bottom:12px">
      <label>سال<input class="field" type="number" data-set="year" value="${c.year}"></label>
      <label>سال کبیسه است (اسفند ۳۰ روز)<input type="checkbox" data-set="leap" ${c.leap?'checked':''}></label>
    </div>
    <h2>ماه‌ها</h2><div class="set" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">${c.months.map((m,i)=>`<div><div class="muted">ماه ${fa(i+1)}</div><div class="row" style="flex-wrap:nowrap">
      <input class="field" data-set="mname" data-i="${i}" value="${esc(m.name)}" aria-label="نام ماه ${fa(i+1)}">
      <input class="field" type="number" min="1" max="62" data-set="mdays" data-i="${i}" value="${m.days}" style="max-width:76px" aria-label="روزهای ماه ${fa(i+1)}"></div></div>`).join('')}</div>
    <h2 style="margin-top:14px">امروز چندم است؟</h2>
    <div class="set"><label>ماه<select class="field" data-set="tm" style="width:100%">${c.months.map((m,i)=>`<option value="${i}" ${i===t.m?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label>
      <label>روز<input class="field" type="number" min="1" max="${c.months[t.m].days}" data-set="td" value="${t.d}"></label>
      <label>روز هفته<select class="field" data-set="twd" style="width:100%">${WD.map((w,i)=>`<option value="${i}" ${i===t.wd?'selected':''}>${w}</option>`).join('')}</select></label></div>
    <div class="note">روز هفته‌ی بقیه‌ی تاریخ‌ها از روی همین تاریخ امروز حساب می‌شود.</div></section>`;
}
</script>
<script>
S.goals=S.goals||[];S.events=S.events||[];
const EVT=[['normal','عادی'],['birthday','تولد'],['special','مخصوص']],RDAYS=[21,14,7,2],BR=['بعد صبحانه','بعد ناهار','شب'],GN={w:'این هفته',m:'این ماه',y:'امسال'};
const gKey=sc=>sc==='w'?idx(V.m,V.d)-wdOf(V.m,V.d):sc==='m'?V.m:0;
const goalsOf=sc=>S.goals.filter(g=>g.sc===sc&&g.k===gKey(sc));
const evDay=e=>idx(e.m,e.d);
function goalLine(g){
  if(g.done>=g.n)return`هدف «${g.t}» تمام شد! افسانه‌ای هستی`;
  if(!g.done)return`هدف «${g.t}» چشم‌به‌راه توست`;
  if(g.done/g.n<.5)return`هدف «${g.t}»: ${fa(g.done)} از ${fa(g.n)}؛ ادامه بده، هنوز جا داری`;
  return`هدف «${g.t}»: ${fa(g.done)} از ${fa(g.n)}؛ خط پایان پیدا شد`;
}
function goalsHtml(sc){
  const l=goalsOf(sc).map(g=>`<div class="gi"><div class="row spread"><b>${esc(g.t)}</b><span class="row" style="gap:4px"><button class="ic" data-g="gm" data-id="${g.id}" aria-label="کم">−</button><span>${fa(g.done)}/${fa(g.n)}</span><button class="ic" data-g="gp" data-id="${g.id}" aria-label="زیاد">＋</button><button class="ic" data-g="gd" data-id="${g.id}" aria-label="حذف">🗑</button></span></div><div class="bar"><i style="width:${Math.min(100,g.done/g.n*100)}%"></i></div></div>`).join('');
  return`<section class="card" style="margin-top:16px"><h2>هدف‌های ${GN[sc]}</h2>${l||'<div class="muted">هنوز هدفی نگذاشتی.</div>'}<div class="row" style="margin-top:10px"><input class="field" id="go-t-${sc}" placeholder="هدف تازه" maxlength="80" style="flex:2;min-width:140px"><input class="field" id="go-n-${sc}" type="number" min="1" value="1" style="width:84px" aria-label="تعداد"><button class="btn primary" data-g="ga" data-sc="${sc}">افزودن</button></div></section>`;
}
function eventsHtml(){
  const l=S.events.slice().sort((a,b)=>evDay(a)-evDay(b)).map(e=>`<div class="gi row spread"><span><span class="pop-tag">${EVT.find(x=>x[0]===e.ty)[1]}</span> <b>${esc(e.t)}</b> · ${dateName(e.m,e.d)}</span><button class="ic" data-g="ed" data-id="${e.id}" aria-label="حذف">🗑</button></div>`).join('');
  return`<section class="card" style="margin-top:16px"><h2>ایونت‌ها</h2>${l||'<div class="muted">ایونتی ثبت نشده.</div>'}<div class="row" style="margin-top:10px"><select class="field" id="ev-ty" style="width:auto">${EVT.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select><input class="field" id="ev-t" placeholder="اسم ایونت" maxlength="80" style="flex:2;min-width:140px"><select class="field" id="ev-m" style="width:auto">${S.cfg.months.map((m,i)=>`<option value="${i}" ${i===V.m?'selected':''}>${esc(m.name)}</option>`).join('')}</select><input class="field" id="ev-d" type="number" min="1" max="62" value="${V.d}" style="width:84px" aria-label="روز"><button class="btn primary" data-g="ea">افزودن</button></div><p class="muted">برای «تولد» و «مخصوص» از ۳ هفته قبل، هر هفته، و ۲ روز قبل یادآوری می‌شود.</p></section>`;
}
function alertsFor(m,d){
  const i=idx(m,d),o=[];
  for(const e of S.events){const df=evDay(e)-i;
    if(df===0)o.push({c:e.ty,t:(e.ty==='birthday'?'🎂 امروز تولد ':e.ty==='special'?'✿ امروز ':'📅 امروز ')+e.t});
    else if(e.ty!=='normal'&&RDAYS.includes(df))o.push({c:e.ty,t:(e.ty==='birthday'?'🎂 تولد ':'✿ ')+e.t+': '+fa(df)+' روز مانده'});}
  return o;
}
const alertsHtml=(m,d)=>alertsFor(m,d).map(a=>`<div class="al ${a.c}">${esc(a.t)}</div>`).join('');
const evMark=(m,d)=>{const n=S.events.filter(e=>e.m===m&&e.d===d).length;return n?`<small>🎉 ${fa(n)} ایونت</small>`:''};
function extraTicks(){const o=[];for(const sc of['w','m','y'])for(const g of goalsOf(sc))o.push(goalLine(g));alertsFor(V.m,V.d).forEach(a=>o.push(a.t));return o}
const foodTotal=day=>(day.food||[]).reduce((a,f)=>a+(+f.c||0),0);
function foodHtml(day){
  const f=day.food||[];
  const g=MEALS.map(([k,n])=>{const it=f.filter(x=>x.k===k);if(!it.length)return'';const sm=it.reduce((a,x)=>a+(+x.c||0),0);
    return`<div class="meal" style="--mc:var(--a3);--mt:var(--on)"><label>${n} · ${fa(sm)} کالری</label>${it.map(x=>`<div class="srow"><span class="tx2"><b>${esc(x.t)}</b> ${esc(x.n)}</span><span>${fa(x.c)} کالری</span><button class="ic" data-g="fd" data-id="${x.id}" aria-label="حذف">🗑</button></div>`).join('')}</div>`}).join('');
  return`<h2>غذا</h2><div class="muted">جمع امروز: <b>${fa(foodTotal(day))} کالری</b></div>${g||'<div class="muted">هنوز غذایی ثبت نشده.</div>'}<div class="form"><select class="field" id="fd-k">${MEALS.map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select><input class="field" id="fd-t" placeholder="عنوان غذا" maxlength="60"><input class="field" id="fd-n" placeholder="اسم غذا" maxlength="60"><input class="field" id="fd-c" type="number" min="0" placeholder="کالری"><button class="btn primary" data-g="fa">افزودن غذا</button></div>`;
}
function waterHtml(day){
  const w=day.water||0;
  const cups=Array.from({length:CUPS},(_,i)=>`<button class="cup cw${i%4}" data-act="cup" data-i="${i}" aria-pressed="${i<w}" aria-label="حباب ${fa(i+1)}">${canSvg()}</button>`).join('');
  return`<h2>آب</h2><div class="muted">${fa(litres(w))} از ${fa(3)} لیتر · هر حباب ${fa(250)} میلی‌لیتر</div><div class="cups">${cups}</div><div class="bar"><i style="width:${Math.min(100,w/CUPS*100)}%"></i></div><div style="height:14px"></div>`;
}
function modalHtml(day){
  if(!V.modal)return'';
  return`<div class="modal" data-act="closeModal"><div class="win" role="dialog" aria-modal="true" aria-label="خوراک"><div class="row spread" style="margin-bottom:8px"><h2 style="margin:0">خوراک امروز</h2><button class="btn sm" data-act="closeModal">بستن</button></div>${waterHtml(day)}${foodHtml(day)}</div></div>`;
}
function dayHtml(){
  const day=dayOf(V.m,V.d),tasks=sorted(day.tasks),sc=!!V.sch;
  const raw=S.days[key(V.m,V.d)],gh=sc?[]:sorted((raw&&raw.sched)||[]);
  const nowH=new Date().getHours(),isT=(V.m===S.cfg.today.m&&V.d===S.cfg.today.d);
  let rows='';
  const HP=72,pm=v=>v*HP/60;
  const lay=list=>{
    const it=list.map(t=>({t,a:toMin(t.start),b:Math.min(1440,Math.max(toMin(t.end),toMin(t.start)+20))})).sort((x,y)=>x.a-y.a||y.b-x.b);
    const out=[];let grp=[],end=0;
    const fl=()=>{const n=Math.max(...grp.map(g=>g.col))+1;grp.forEach(g=>{g.cols=n;out.push(g)});grp=[];end=0};
    for(const x of it){
      if(grp.length&&x.a>=end)fl();
      const used=grp.filter(g=>g.b>x.a).map(g=>g.col);let c=0;while(used.includes(c))c++;
      x.col=c;grp.push(x);end=Math.max(end,x.b);
    }
    if(grp.length)fl();return out;
  };
  const mk=(list,ghost)=>lay(list).map(g=>{
    const t=g.t,e=Math.min(1440,toMin(t.end)),ht=Math.max(pm(e-g.a),10),w=100/g.cols;
    const inner=ghost?`<div class="ghost" style="--c:${t.color}"><span>${esc(t.text)}<br>${hhmm(t.start)}–${hhmm(t.end)}</span><button class="ic" data-g="adopt" data-id="${t.id}" title="اجرا در برنامه اصلی" aria-label="اجرا در برنامه اصلی">⤵</button></div>`:taskHtml(t);
    return`<div class="blk ${ht<46?'s':''} ${ghost?'gz':''}" style="top:${pm(g.a)}px;height:${ht}px;inset-inline-start:${g.col*w}%;width:calc(${w}% - 4px)" title="${hhmm(t.start)} تا ${hhmm(t.end)}" ${ghost?'':`data-act="edit" data-id="${t.id}"`}>${inner}</div>`;
  }).join('');
  let lines='';
  for(let h=0;h<24;h++)lines+=`<button class="slot" data-act="add" data-h="${h}" style="top:${pm(h*60)}px;height:${HP}px" aria-label="افزودن برنامه ساعت ${fa(h)}"><span class="hl">${fa(String(h).padStart(2,'0'))}:${fa('00')}</span></button>`;
  const nd=new Date(),nowl=!sc&&isT?`<div class="nowl" style="top:${pm(nd.getHours()*60+nd.getMinutes())}px"><span class="now" title="الان">${sunSvg(true)}</span></div>`:'';
  rows=`<div class="tl" style="height:${pm(1440)}px">${lines}<div class="bkm" style="inset-inline-end:${gh.length?'32%':'0'}">${mk(tasks,false)}</div>${gh.length?`<div class="bkg">${mk(gh,true)}</div>`:''}${nowl}</div>`;
  const done=day.tasks.filter(t=>t.status==='done').length,al=sc?'':alertsHtml(V.m,V.d);
  const modes=`<div class="modes"><button class="btn" data-g="sch" data-v="0" aria-pressed="${!sc}">برنامه اصلی</button><button class="btn" data-g="sch" data-v="1" aria-pressed="${sc}">اسکچوال</button></div>`;
  const top=sc?schedTools():`<div class="tools"><button class="btn" data-act="openModal" data-w="food">خوراک · ${fa(foodTotal(day))} کالری · ${fa(litres(day.water||0))} لیتر آب</button></div>
    <div class="brush">${BR.map((n,i)=>`<button class="bb" data-g="br" data-i="${i}" aria-pressed="${!!(day.brush&&day.brush[i])}"><span>🪥</span>مسواک ${n}</button>`).join('')}</div>${al?`<div class="alerts">${al}</div>`:''}`;
  return modes+top+`<section class="card" style="margin-top:14px"><div class="row spread"><h2>${sc?'اسکچوال (طرح پیش‌فرض)':'برنامه‌ی ساعتی'}</h2>
      <span class="muted">${sc?fa(day.tasks.length)+' مورد':fa(done)+' از '+fa(day.tasks.length)+' کار انجام شد'}</span></div>
      ${gh.length?`<button class="btn sm" data-g="adoptall">اجرای کل اسکچوال امروز</button>`:''}${formHtml()}${rows}</section>`+(sc?'':modalHtml(day));
}
const rawDay=(m,d)=>S.days[key(m,d)]||(S.days[key(m,d)]={tasks:[],meals:{},water:0});
const cl=a=>a.map(t=>({...t,id:rid(),status:''}));
const sget=p=>{const x=S.days[key(p.m,p.d)];return x&&x.sched?x.sched:[]};
const touchAll=l=>[...new Set(l.map(x=>x.m))].forEach(m=>touch(m));
function rangeOf(sc){
  const a=[];
  if(sc==='d')return[{m:V.m,d:V.d}];
  if(sc==='w'){const s0=idx(V.m,V.d)-wdOf(V.m,V.d);for(let i=s0;i<s0+7;i++)if(i>=0&&i<total())a.push(fromIdx(i));return a}
  if(sc==='m'){for(let d=1;d<=S.cfg.months[V.m].days;d++)a.push({m:V.m,d});return a}
  for(let m=0;m<12;m++)for(let d=1;d<=S.cfg.months[m].days;d++)a.push({m,d});return a;
}
function schedCopy(s0,t,rp){
  const rk={d:0,w:1,m:2,y:3};
  if(rk[t]<=rk[s0]){V.msg='مقصد باید بزرگ‌تر از مبدأ باشد (مثلاً روز ← هفته).';return}
  const src=rangeOf(s0),tg=rangeOf(t),sk=new Set(src.map(p=>key(p.m,p.d)));let n=0;
  const put=(p,it)=>{const x=rawDay(p.m,p.d);x.sched=rp?cl(it):[...(x.sched||[]),...cl(it)];n++};
  if(s0==='d'){const it=sget(src[0]);tg.forEach(p=>{if(!sk.has(key(p.m,p.d)))put(p,it)})}
  else if(s0==='w'){const bw={};src.forEach(p=>bw[wdOf(p.m,p.d)]=sget(p));tg.forEach(p=>{const w=wdOf(p.m,p.d);if(!sk.has(key(p.m,p.d))&&bw[w])put(p,bw[w])})}
  else{const bd={};src.forEach(p=>bd[p.d]=sget(p));tg.forEach(p=>{if(p.m!==V.m&&bd[p.d])put(p,bd[p.d])})}
  touchAll(tg);V.msg='روی '+fa(n)+' روز کپی شد.';
}
function schedDel(t){const tg=rangeOf(t);tg.forEach(p=>{const x=S.days[key(p.m,p.d)];if(x)x.sched=[]});touchAll(tg);V.msg='حذف شد.'}
function schedTools(){
  const o=(v,t,sel)=>`<option value="${v}" ${sel===v?'selected':''}>${t}</option>`;
  return`<section class="card" style="margin-top:14px"><h2>کپی و حذف اسکچوال</h2>
   <div class="row"><select class="field" id="cp-s" style="width:auto">${o('d','این روز')}${o('w','این هفته')}${o('m','این ماه')}</select><span>←</span>
   <select class="field" id="cp-t" style="width:auto">${o('w','کل روزهای هفته')}${o('m','کل روزهای ماه')}${o('y','کل سال')}</select>
   <label class="row"><input type="checkbox" id="cp-r" checked style="width:auto"> جایگزین شود</label><button class="btn primary" data-g="scopy">کپی</button></div>
   <div class="row" style="margin-top:8px"><select class="field" id="rm-t" style="width:auto">${o('d','حذف روز',V.cd)}${o('w','حذف هفته',V.cd)}${o('m','حذف ماه',V.cd)}${o('y','حذف سال',V.cd)}</select><button class="btn" data-g="sdel">${V.cd?'تأیید حذف':'حذف اسکچوال'}</button></div>
   <div class="muted">${esc(V.msg||'')}</div></section>`;
}
const backupHtml=()=>`<section class="card" style="margin-top:16px"><h2>پشتیبان‌گیری</h2><div class="row"><button class="btn primary" data-g="exm">خروجی ماه ${esc(S.cfg.months[V.m].name)}</button><button class="btn" data-g="exy">خروجی کل سال</button></div><textarea class="field" id="bk" rows="4" dir="ltr" placeholder="متن خروجی اینجا می‌آید، یا متن پشتیبان را اینجا بچسبانید">${esc(V.bk||'')}</textarea><div class="row"><input type="file" id="bk-f" accept=".json,application/json" style="width:auto"><button class="btn" data-g="imp">ورودی (ماه یا سال)</button></div><div class="muted">فایل «ماه» در ماهی که الان باز است جایگزین می‌شود.${V.msg2?' · '+esc(V.msg2):''}</div></section>`;
async function dlSave(str,name){
  try{
    const b=new Blob([str],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();
    setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},4000);V.msg2='ذخیره شد.';
  }catch(e){V.msg2='دانلود انجام نشد؛ متن بالا را کپی کنید.'}
  render();
}
function impText(txt){
  let j;try{j=JSON.parse(txt)}catch(e){return'متن معتبر نیست.'}
  if(j.type==='planner-month'){
    for(const k of Object.keys(S.days))if(k.split('-')[0]===String(V.m))delete S.days[k];
    const mx=S.cfg.months[V.m].days;
    for(const k in j.days){const d=+k.split('-')[1];if(d>=1&&d<=mx)S.days[V.m+'-'+d]=j.days[k]}
    touch(V.m);return'ماه جایگزین شد: '+S.cfg.months[V.m].name;
  }
  if(j.type==='planner-year'){
    if(V.ci!==1){V.ci=1;return'این کار کل سال را جایگزین می‌کند. دوباره بزنید تا انجام شود.'}
    V.ci=0;S.cfg=j.cfg;S.routines=j.routines||[];S.goals=j.goals||[];S.events=j.events||[];S.days=j.days||{};
    touch('cfg');for(let m=0;m<12;m++)touch(m);return'کل سال جایگزین شد.';
  }
  return'فایل ناشناخته است.';
}
$('#main').addEventListener('change',e=>{
  if(e.target.id!=='bk-f')return;const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{V.bk=String(r.result);V.msg2='فایل خوانده شد؛ حالا «ورودی» را بزنید.';render()};r.readAsText(f);
});
$('#main').addEventListener('click',e=>{
  const b=e.target.closest('[data-g]');if(!b)return;
  const g=b.dataset.g,id=b.dataset.id,v=q=>{const x=$(q);return x?x.value.trim():''};
  if(g==='br'){const day=ensure(V.m,V.d);day.brush=day.brush||[false,false,false];day.brush[+b.dataset.i]=!day.brush[+b.dataset.i];touch(V.m)}
  else if(g==='fa'){const t=v('#fd-t'),n=v('#fd-n');if(!t&&!n){$('#fd-t').focus();return}const day=ensure(V.m,V.d);(day.food=day.food||[]).push({id:rid(),k:v('#fd-k'),t,n,c:Math.max(0,parseInt(v('#fd-c'))||0)});touch(V.m)}
  else if(g==='fd'){const day=ensure(V.m,V.d);day.food=(day.food||[]).filter(x=>x.id!==id);touch(V.m)}
  else if(g==='ga'){const sc=b.dataset.sc,t=v('#go-t-'+sc);if(!t){$('#go-t-'+sc).focus();return}S.goals.push({id:rid(),sc,k:gKey(sc),t,n:Math.max(1,parseInt(v('#go-n-'+sc))||1),done:0});touch('cfg')}
  else if(g==='gp'||g==='gm'){const o=S.goals.find(x=>x.id===id);if(o){o.done=Math.max(0,o.done+(g==='gp'?1:-1));touch('cfg');if(g==='gp'&&o.done===o.n)celebrate('هدف تمام شد!')}}
  else if(g==='gd'){S.goals=S.goals.filter(x=>x.id!==id);touch('cfg')}
  else if(g==='ea'){const t=v('#ev-t');if(!t){$('#ev-t').focus();return}const m=+v('#ev-m');S.events.push({id:rid(),ty:v('#ev-ty'),t,m,d:Math.max(1,Math.min(S.cfg.months[m].days,parseInt(v('#ev-d'))||1))});touch('cfg')}
  else if(g==='ed'){S.events=S.events.filter(x=>x.id!==id);touch('cfg')}
  else if(g==='sch'){V.sch=b.dataset.v==='1';V.form=null}
  else if(g==='adopt'){const x=rawDay(V.m,V.d),t=(x.sched||[]).find(q=>q.id===id);if(t){x.tasks.push({...t,id:rid(),status:''});touch(V.m)}}
  else if(g==='adoptall'){const x=rawDay(V.m,V.d);x.tasks.push(...cl(x.sched||[]));touch(V.m)}
  else if(g==='scopy'){schedCopy(v('#cp-s'),v('#cp-t'),$('#cp-r').checked)}
  else if(g==='sdel'){const t=v('#rm-t');if(V.cd===t){schedDel(t);V.cd=null}else{V.cd=t;V.msg='دوباره بزنید تا حذف شود.'}}
  else if(g==='exm'){const t=JSON.stringify({type:'planner-month',v:1,m:V.m,name:S.cfg.months[V.m].name,days:monthDays(V.m)});V.bk=t;V.msg2='';dlSave(t,'planner-month-'+(V.m+1)+'.json')}
  else if(g==='exy'){const t=JSON.stringify({type:'planner-year',v:1,cfg:S.cfg,routines:S.routines,goals:S.goals,events:S.events,days:S.days});V.bk=t;V.msg2='';dlSave(t,'planner-year.json')}
  else if(g==='imp'){V.bk=v('#bk');V.msg2=impText(V.bk)}
  render();
});
</script>
<script>
function label(){
  const c=S.cfg,y=fa(c.year);
  if(V.v==='day')return WD[wdOf(V.m,V.d)]+' '+dateName(V.m,V.d)+' '+y;
  if(V.v==='week'){
    const s=idx(V.m,V.d)-wdOf(V.m,V.d),a=fromIdx(Math.max(0,s)),b=fromIdx(Math.min(total()-1,s+6));
    return dateName(a.m,a.d)+' تا '+dateName(b.m,b.d)+' '+y;
  }
  if(V.v==='routine')return 'روتین‌ها';
  if(V.v==='month')return c.months[V.m].name+' '+y;
  return 'سال '+y;
}
let lastSun='',lastTick='';
function tickHtml(){
  const phr=['صلح و عشق و برنامه','امروز را رنگی کن','هر روز یک کهکشان تازه','آب یادت نره'],a=[];
  if(V.v==='day'&&!V.showSet){
    const day=dayOf(V.m,V.d),dn=day.tasks.filter(t=>t.status==='done').length,st=day.tasks.filter(t=>t.star).length;
    a.push(fa(dn)+' کار انجام شد','آب '+fa(litres(day.water||0))+' از '+fa(3)+' لیتر');if(st)a.push(fa(st)+' کار مهم');
  }
  a.push(...extraTicks(),...phr);
  const half=(a.join('  ✿  ')+'  ✿  ').repeat(3);
  return'<div>'+half+half+'</div>';
}
function syncForm(){
  if(!V.form||!$('#f-text'))return;
  V.form.text=$('#f-text').value;V.form.start=$('#f-start').value||V.form.start;V.form.end=$('#f-end').value||V.form.end;V.form.star=$('#f-star').checked;
}
function rpEvent(t){
  const k=t.dataset.rp;if(!k||!V.rp)return false;
  if(k==='start')V.rp.start=t.value||V.rp.start;
  else if(k==='min')V.rp.mins[t.dataset.id]=Math.max(1,parseInt(t.value)||1);
  else if(k==='inc')V.rp.skip[t.dataset.id]=!t.checked;
  rpUpdate();return true;
}
function render(){
  if(V.v!=='day'||V.showSet)V.sch=false;document.body.classList.toggle('sch',!!V.sch);
  if(!V.form)V.rp=null;
  clampView();
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===V.v)));
  $('#dateLabel').innerHTML=esc(V.showSet?'تنظیم تقویم':label())+(V.v==='day'&&!V.showSet?`<small>شماره‌ی ${fa(idx(V.m,V.d)+1)} از ${fa(total())}</small>`:'');
  $('#main').innerHTML=V.showSet?settingsHtml():({day:dayHtml,week:weekHtml,month:monthHtml,year:yearHtml,routine:routinesHtml})[V.v]();
  if(V.rp)rpUpdate();
  {const dd=dayOf(V.m,V.d),all=V.v==='day'&&!V.showSet&&dd.tasks.length&&dd.tasks.every(t=>t.status==='done');
   const sm=sunSvg(all?false:V.glasses);if(sm!==lastSun){lastSun=sm;($('#sunLogo')||{}).innerHTML=sm}
   const tk=tickHtml();if(tk!==lastTick){lastTick=tk;$('#ticker').innerHTML=tk}}
  {const nv=V.showSet||V.v==='year'||V.v==='routine';['#prev','#next','#goToday'].forEach(q=>{$(q).hidden=nv})}
}
function shift(n){
  if(V.v==='year'||V.v==='routine')return;
  if(V.v==='month'){V.m=Math.max(0,Math.min(11,V.m+n));V.d=Math.min(V.d,S.cfg.months[V.m].days);return}
  const step=V.v==='week'?7*n:n,i=Math.max(0,Math.min(total()-1,idx(V.m,V.d)+step)),p=fromIdx(i);
  V.m=p.m;V.d=p.d;V.form=null;
}
const curR=()=>S.routines.find(r=>r.id===V.rid);
function findTask(m,d,id){return dayOf(m,d).tasks.find(t=>t.id===id)}
function openForm(h,t){
  V.form=t?{id:t.id,text:t.text,start:t.start,end:t.end,color:t.color,star:!!t.star}
    :{text:'',start:fromMin(h*60),end:fromMin(h*60+60),color:COLORS[0],star:false};
}
function saveTask(){
  const f=V.form,text=$('#f-text').value.trim();
  if(!text){$('#f-text').focus();return}
  let s=$('#f-start').value||f.start,e=$('#f-end').value||f.end;
  if(toMin(e)<=toMin(s))e=fromMin(toMin(s)+60);
  const day=ensure(V.m,V.d),star=$('#f-star').checked;
  if(f.id){const t=day.tasks.find(x=>x.id===f.id);if(t)Object.assign(t,{text,start:s,end:e,color:f.color,star})}
  else day.tasks.push({id:rid(),text,start:s,end:e,color:f.color,star,status:''});
  V.form=null;touch(V.m);
}
function setStatus(m,d,id,st){
  const t=findTask(m,d,id);if(!t)return;
  t.status=t.status===st?'':st;touch(m);
  const all=dayOf(m,d).tasks;
  if(t.status==='done'&&all.length&&all.every(x=>x.status==='done'))celebrate('آفرین! همه‌ی کارهای امروز تمام شد');
}
$('#main').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  if(b.dataset.act==='closeModal'&&b.classList.contains('modal')&&e.target!==b)return;
  syncForm();
  const a=b.dataset.act,id=b.dataset.id,m=b.dataset.m!==undefined?+b.dataset.m:V.m,d=b.dataset.d!==undefined?+b.dataset.d:V.d;
  if(a==='color'){V.form.color=b.dataset.c;document.querySelectorAll('#f-colors button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));return}
  if(a==='add')openForm(+b.dataset.h);
  else if(a==='edit')openForm(0,findTask(V.m,V.d,id));
  else if(a==='cancelTask'){V.form=null;V.rp=null}
  else if(a==='saveTask'){saveTask();if(V.form)return}
  else if(a==='done')setStatus(V.m,V.d,id,'done');
  else if(a==='skip')setStatus(V.m,V.d,id,'skip');
  else if(a==='star'){const t=findTask(V.m,V.d,id);if(t){t.star=!t.star;touch(V.m)}}
  else if(a==='wstar'){const t=findTask(m,d,id);if(t){t.star=!t.star;touch(m)}}
  else if(a==='del'){const day=ensure(V.m,V.d);day.tasks=day.tasks.filter(t=>t.id!==id);touch(V.m)}
  else if(a==='cup'){const day=ensure(V.m,V.d),n=+b.dataset.i+1;day.water=day.water===n?n-1:n;touch(V.m);if(day.water===CUPS)celebrate('سه لیتر! ماهی‌ها حسودیشون شد')}
  else if(a==='goday'){V.m=m;V.d=d;V.v='day';V.form=null}
  else if(a==='openModal')V.modal=b.dataset.w;
  else if(a==='closeModal')V.modal=null;
  else if(a==='toggleRP')V.rp=V.rp?null:{id:S.routines[0]?S.routines[0].id:null,start:(($('#f-start')||{}).value)||V.form.start,skip:{},mins:{}};
  else if(a==='pickR'){V.rp.id=id;V.rp.skip={};V.rp.mins={}}
  else if(a==='applyRP'){
    const{r,out}=rpSchedule(),day=ensure(V.m,V.d);
    for(const x of out)day.tasks.push({id:rid(),text:x.text,start:fromMin(x.a),end:fromMin(x.b),color:r.color,star:false,status:'',r:r.name});
    V.rp=null;V.form=null;touch(V.m);
  }
  else if(a==='selR')V.rid=id;
  else if(a==='newR'){const r={id:rid(),name:'روتین جدید',color:COLORS[S.routines.length%COLORS.length],steps:[{id:rid(),text:'',min:10}]};S.routines.push(r);V.rid=r.id;touch('cfg')}
  else if(a==='delR'){S.routines=S.routines.filter(x=>x.id!==V.rid);V.rid=null;touch('cfg')}
  else if(a==='rcolor'){const r=curR();if(r){r.color=b.dataset.c;touch('cfg')}}
  else if(a==='addS'){const r=curR();if(r){r.steps.push({id:rid(),text:'',min:5});touch('cfg')}}
  else if(a==='delS'){const r=curR();if(r){r.steps=r.steps.filter(x=>x.id!==id);touch('cfg')}}
  else if(a==='closeSet')V.showSet=false;
  render();
  if(a==='add'||a==='edit'){const f=$('#taskForm');if(f)f.scrollIntoView({block:'center',behavior:'smooth'});const x=$('#f-text');if(x)x.focus({preventScroll:true})}
  if(a==='toggleRP'){const x=$('#rpx');if(x)x.scrollIntoView({block:'nearest',behavior:'smooth'})}
});
$('#main').addEventListener('input',e=>{
  const t=e.target;
  if(rpEvent(t))return;
  if(t.dataset.cp==='task'&&V.form){V.form.color=t.value;document.querySelectorAll('#f-colors button').forEach(x=>x.setAttribute('aria-pressed','false'));return}
  if(t.dataset.meal){const day=ensure(V.m,V.d);day.meals[t.dataset.meal]=t.value;touch(V.m)}
  else if(t.dataset.r==='name'){const r=curR();if(r){r.name=t.value;const c=document.querySelector('[data-chipname="'+r.id+'"]');if(c)c.textContent=t.value;touch('cfg')}}
  else if(t.dataset.s){
    const r=curR(),s=r&&r.steps.find(x=>x.id===t.dataset.id);
    if(s){if(t.dataset.s==='text')s.text=t.value;else s.min=Math.max(1,parseInt(t.value)||1);
      const c=document.querySelector('[data-chipmin="'+r.id+'"]');if(c)c.textContent=fa(rTotal(r))+' دقیقه';
      const tt=$('#rTotal');if(tt)tt.textContent=totalText(r);touch('cfg')}
  }
});
$('#main').addEventListener('change',e=>{
  const t=e.target;
  if(rpEvent(t))return;
  if(t.dataset.cp==='routine'){const r=curR();if(r){r.color=t.value;touch('cfg');render()}return}
  const k=t.dataset.set;if(!k)return;
  const c=S.cfg,i=+t.dataset.i;
  if(k==='year')c.year=Math.max(1,parseInt(t.value)||c.year);
  else if(k==='leap'){c.leap=t.checked;c.months[11].days=t.checked?30:29}
  else if(k==='mname')c.months[i].name=t.value.trim()||c.months[i].name;
  else if(k==='mdays'){c.months[i].days=Math.max(1,Math.min(62,parseInt(t.value)||c.months[i].days));if(i===11)c.leap=c.months[11].days>=30}
  else if(k==='tm')c.today.m=+t.value;
  else if(k==='td')c.today.d=Math.max(1,Math.min(c.months[c.today.m].days,parseInt(t.value)||c.today.d));
  else if(k==='twd')c.today.wd=+t.value;
  c.today.d=Math.min(c.today.d,c.months[c.today.m].days);
  touch('cfg');render();
});
$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  V.v=b.dataset.v;V.showSet=false;V.form=null;render();
});
$('#prev').onclick=()=>{shift(-1);render()};
$('#next').onclick=()=>{shift(1);render()};
$('#goToday').onclick=()=>{V.m=S.cfg.today.m;V.d=S.cfg.today.d;V.showSet=false;V.form=null;render()};
$('#btnSet').onclick=()=>{V.showSet=!V.showSet;render()};
{const t=S.cfg.today;V.m=t.m;V.d=t.d}


// Easter eggs: tap the title five times to change the ink colours; type "pop" (or پاپ) anywhere for a burst.
let tapN=0,tapT=0,kbuf='';
$('#title').addEventListener('click',()=>{
  const now=Date.now();tapN=now-tapT<3000?tapN+1:1;tapT=now;
  if(tapN>=5){tapN=0;CW=(CW+1)%4;try{localStorage.setItem('planner-cw',String(CW))}catch(e){}applyCW();celebrate('رنگ‌بندی عوض شد!')}
});
document.addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||'')))return;
  if(e.key&&e.key.length===1){kbuf=(kbuf+e.key).slice(-3).toLowerCase();if(kbuf==='pop'||kbuf==='پاپ'){kbuf='';celebrate('پاپ!')}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&V.modal){V.modal=null;render()}});
boot();
</script>

<script>
(function(){
  const w=document.querySelector('.wrap'),sp=document.createElement('div');
  sp.id='splash';sp.setAttribute('role','button');sp.tabIndex=0;sp.setAttribute('aria-label','ورود به برنامه');
  sp.innerHTML=sunSvg(true);document.body.appendChild(sp);w.inert=true;sp.focus({preventScroll:true});
  let go=false;
  const enter=()=>{if(go)return;go=true;sp.innerHTML=sunSvg(false);sp.classList.add('go');w.inert=false;setTimeout(()=>sp.remove(),650)};
