<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>چراغ مطالعه 💡</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#f6f3ee;--fg:#1c1b19;--card:#fff;--mut:#7a746a;--line:#e3ddd2;--ac:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15130f;--fg:#f1ece3;--card:#211e19;--mut:#9a9387;--line:#38332b;--ac:#ea580c}}
:root[data-theme=dark]{--bg:#15130f;--fg:#f1ece3;--card:#211e19;--mut:#9a9387;--line:#38332b;--ac:#ea580c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--fg);line-height:1.7}
button,select,input,textarea{font:inherit;color:inherit}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px;max-width:900px;margin:auto}
h1{font-size:19px;margin:0}h2{margin:6px 0 10px;font-size:18px}h3{margin:0}
nav{display:flex;gap:6px;padding:0 16px;overflow-x:auto;max-width:900px;margin:auto}
nav button{border:0;background:none;padding:7px 12px;border-radius:20px;cursor:pointer;color:var(--mut);white-space:nowrap}
nav button.on{background:var(--fg);color:var(--bg)}
main{padding:12px 16px 70px;max-width:900px;margin:auto}
.b,.s,.d{border:0;border-radius:10px;padding:8px 14px;cursor:pointer;display:inline-block}
.b{background:var(--ac);color:#fff}.s{background:var(--card);border:1px solid var(--line)}.d{background:#dc2626;color:#fff}
.h{color:var(--mut);font-size:12.5px;margin:6px 0}
.tr{display:flex;margin-bottom:6px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.tl{width:50px;display:grid;place-items:center;font-weight:700;font-size:24px;color:#fff;flex:none}
.tz{flex:1;display:flex;flex-wrap:wrap;gap:6px;padding:6px;min-height:104px}
.tz.ov{background:#8883}
.fc{width:74px;text-align:center;cursor:pointer}
.po{background:#8884 center/cover no-repeat;border-radius:6px;aspect-ratio:2/3;position:relative;flex:none}
.fc i{position:absolute;bottom:3px;left:3px;background:#000b;color:#fff;font-weight:700;font-size:11px;font-style:normal;padding:0 6px;border-radius:6px}
.fc small{display:block;font-size:10px;line-height:1.3;margin-top:2px;max-height:26px;overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;color:var(--mut);font-size:12px}
.dy{min-height:62px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px;cursor:pointer;display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start;font-size:12px}
.dy>span{width:100%;color:var(--mut)}.dy.td{border-color:var(--ac)}.dy.td>span{color:var(--ac);font-weight:700}
.dy u{width:calc(50% - 1px);aspect-ratio:2/3;border-radius:3px;background:#8884 center/cover}
.dy em{font-size:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}
.rep,.cap{--bg:#0e3a5f;--fg:#f7edc8;--card:#0a2d4a;--mut:#a9c3d6;--line:#8a6d1f;background:#0e3a5f;color:#f7edc8;font-family:Vazirmatn,Tahoma,sans-serif;direction:rtl;line-height:1.7}
.cap{--bg:#0e3a5f;--fg:#f7edc8;--card:#0a2d4a;--mut:#a9c3d6;--line:#8a6d1f;background:#0e3a5f;color:#f7edc8;font-family:Vazirmatn,Tahoma,sans-serif;direction:rtl;line-height:1.7}
.win{display:flex;gap:14px;align-items:center;background:linear-gradient(120deg,#fde68a55,#fb923c33);border-radius:12px;padding:12px;margin-bottom:10px}
.win .po{width:96px}
ol{padding:0;margin:0;list-style:none}
ol li{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
ol .po{width:34px}ol li b{flex:1}
.chip{display:inline-block;color:#fff;border-radius:6px;padding:0 9px;font-weight:700;font-size:14px}
#mod{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:9}
#mod[hidden]{display:none}
.sh{background:var(--bg);width:min(580px,100%);max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));position:relative}
.x{position:absolute;top:10px;left:10px;border:0;background:var(--card);border-radius:50%;width:30px;height:30px;cursor:pointer}
label{display:block;margin:9px 0 3px;font-size:13px;color:var(--mut)}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.ph{display:grid;place-items:center;width:78px;aspect-ratio:2/3;border:2px dashed var(--line);border-radius:8px;background:center/cover no-repeat;font-size:11px;color:var(--mut);cursor:pointer;margin:0 0 6px}
.ph.on{border-style:solid}.ph.on span{display:none}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.r2{display:flex;gap:12px;align-items:flex-start}
.dt{display:flex;gap:14px}.dt .po{width:110px}
.ac{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap}.ac div{text-align:center;width:62px;font-size:11px;line-height:1.3}
.ac u{display:block;width:54px;height:54px;border-radius:50%;background:#8884 center/cover;margin:0 auto 3px}
blockquote{margin:8px 0;padding:6px 12px;border-right:3px solid var(--ac);font-weight:700}
.rv{white-space:pre-wrap}
.fb{display:flex;gap:14px;padding:18px;background:#0e3a5f;color:#f7edc8;border-bottom:1px solid #8a6d1f}
.fb .po{width:130px}.fb .fi{flex:1}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:20px;z-index:20;font-size:13px}
#toast:empty{display:none}
html:root:root:root{--bg:#0e3a5f;--fg:#f7edc8;--card:#0a2d4a;--mut:#a9c3d6;--line:#8a6d1f;--ac:#d4a62a}.b{color:#0e3a5f;font-weight:700}h1{color:var(--ac)}.lgi{width:30px;height:30px;vertical-align:middle}#intro{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer;transition:opacity .7s,visibility .7s}#intro.out{opacity:0;visibility:hidden}body{background:var(--bg);background-image:repeating-conic-gradient(#ffffff0d 0 25%,transparent 0 50%);background-size:28px 28px}
header{border-bottom:4px double var(--ac)}.tr{border:1px solid var(--ac);box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px #1fa3a388}.sh{border-top:4px double var(--ac)}
#intro{background:#05182a}#lamp{width:250px}#hs,#hf{transform-box:fill-box;transform-origin:center;transition:transform .7s,opacity .7s}#hf{opacity:0;transform:scaleX(.25)}
.turn #hs{opacity:0;transform:scaleX(.25)}.turn #hf{opacity:1;transform:scaleX(1)}#bulb{fill:#6b5a2a;transition:fill .6s,filter .6s}.turn #bulb{fill:#fffbe8;filter:drop-shadow(0 0 14px #fff3c4) drop-shadow(0 0 30px #ffd66b)}
#glow{position:absolute;left:50%;top:calc(50% - 62px);width:40px;height:40px;margin:-20px;border-radius:50%;background:radial-gradient(circle,#fffbe8 0,#ffeeb5 55%,#ffd66b);transform:scale(0);pointer-events:none}.lit #glow{transition:transform 1s ease-in;transform:scale(90)}
</style></head><body><svg width="0" height="0" style="position:absolute"><symbol id="LG" viewBox="0 0 200 200"><defs><linearGradient id="lc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".75"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></linearGradient></defs><g transform="rotate(-20 118 60)"><path d="M84 64L152 64L190 178L46 178Z" fill="url(#lc)"/></g><ellipse cx="70" cy="180" rx="42" ry="9" fill="#d4a62a"/><polyline points="70,176 70,112 118,46" fill="none" stroke="#d4a62a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><g transform="rotate(-20 118 60)"><path d="M80 64A38 32 0 0 1 156 64Z" fill="#1fa3a3" stroke="#d4a62a" stroke-width="5" stroke-linejoin="round"/><ellipse cx="118" cy="67" rx="16" ry="5" fill="#fff3c4"/></g></symbol></svg>
<header><h1><svg class="lgi" viewBox="0 0 200 200"><use href="#LG"/></svg> چراغ مطالعه</h1><button class="b" id="add">+ کتاب جدید</button></header>
<nav id="nav"></nav><main id="m"></main><div id="intro"><svg id="lamp" viewBox="0 0 300 400"><ellipse cx="150" cy="374" rx="70" ry="12" fill="#d4a62a"/><polyline points="150,372 110,250 160,160" fill="none" stroke="#d4a62a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="110" cy="250" r="9" fill="#b8912a"/><g id="hs"><path d="M175 105L105 80V170L175 145Z" fill="#1fa3a3" stroke="#d4a62a" stroke-width="6" stroke-linejoin="round"/></g><g id="hf"><circle cx="150" cy="125" r="62" fill="#1fa3a3" stroke="#d4a62a" stroke-width="8"/><circle cx="150" cy="125" r="42" fill="#0e3a5f"/><circle id="bulb" cx="150" cy="125" r="26"/></g></svg><div id="glow"></div></div><div id="mod" hidden></div><div id="toast"></div>
<script src="lib/html-to-image.js"></script><script src="lib/export-shim.js"></script><script>
const $=(s,e=document)=>e.querySelector(s),T=['S','A','B','C','D','F'],
TC={S:'#ef4444',A:'#f97316',B:'#eab308',C:'#22c55e',D:'#3b82f6',F:'#8b5cf6'},
MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'],
WD=['ش','ی','د','س','چ','پ','ج'],
fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]),
sc=n=>fa(n).replace('.','٫'),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
pf=new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric',timeZone:'UTC'}),
today=()=>{const n=new Date();return new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))},
iso=d=>d.toISOString().slice(0,10),parse=s=>new Date(s+'T00:00:00Z'),
bg=u=>`style="background-image:url('${u||''}')"`;
function J(d){const p={};pf.formatToParts(d).forEach(x=>p[x.type]=x.value);const n=s=>+String(s).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c));return{y:n(p.relatedYear||p.year),m:n(p.month),d:n(p.day)}}
function j2g(y,m,d){let g=new Date(Date.UTC(y+621,2,21)+864e5*((m<7?(m-1)*31:186+(m-7)*30)+d-1));
for(let i=0;i<6;i++){const j=J(g),k=(j.y*372+j.m*31+j.d)-(y*372+m*31+d);if(!k)break;g=new Date(+g-864e5*Math.sign(k))}return g}
const fj=s=>{const j=J(parse(s));return fa(j.d)+' '+MN[j.m-1]+' '+fa(j.y)};
let F=[],tab='board',cy,cm,pm='m',py,pmo,cur,delId;
/* storage */
const idb=new Promise(r=>{try{const q=indexedDB.open('lamp',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function load(){const d=await idb;if(!d)return[];return new Promise(r=>{try{const q=d.transaction('k').objectStore('k').get('films');q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([])}catch(e){r([])}})}
async function save(){const d=await idb;if(!d)return;try{d.transaction('k','readwrite').objectStore('k').put(F,'films')}catch(e){}}
function toast(t){const e=$('#toast');e.textContent=t;clearTimeout(toast.t);toast.t=setTimeout(()=>e.textContent='',3000)}
function img(file,max=520){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.82))};i.onerror=()=>r('');i.src=fr.result};fr.readAsDataURL(file)})}
async function dl(name,data){try{await window.__saveFile(name,data);toast('ذخیره شد')}catch(e){toast('ذخیره نشد')}}
/* views */
const card=f=>`<div class="fc" draggable="true" data-id="${f.id}"><div class="po" ${bg(f.poster)}><i>${sc(f.score)}</i></div><small>${esc(f.title)}</small></div>`;
const boardH=()=>T.map(t=>`<div class="tr"><div class="tl" style="background:${TC[t]}">${t}</div><div class="tz" data-t="${t}">${F.filter(f=>f.tier==t).sort((a,b)=>b.score-a.score).map(card).join('')}</div></div>`).join('');
function cal(){if(!cy){const j=J(today());cy=j.y;cm=j.m}
const g1=j2g(cy,cm,1),nx=cm==12?j2g(cy+1,1,1):j2g(cy,cm+1,1),n=Math.round((nx-g1)/864e5),off=(g1.getUTCDay()+1)%7;
let c=WD.map(w=>`<div class="wd">${w}</div>`).join('')+'<div></div>'.repeat(off);
for(let i=0;i<n;i++){const s=iso(new Date(+g1+864e5*i)),fs=F.filter(f=>f.date==s);
c+=`<div class="dy${s==iso(today())?' td':''}" data-d="${s}"><span>${fa(i+1)}</span>${fs.slice(0,2).map(f=>`<u ${bg(f.poster)}></u>`).join('')}${fs.length>2?`<em>+${fa(fs.length-2)}</em>`:''}</div>`}
return `<div class="ch"><button class="s" data-n="-1">ماه قبل</button><h2 style="margin:0">${MN[cm-1]} ${fa(cy)}</h2><button class="s" data-n="1">ماه بعد</button></div><div class="cg">${c}</div>`}
const per=()=>F.filter(f=>{const j=J(parse(f.date));return j.y==py&&(pm=='y'||j.m==pmo)}).sort((a,b)=>b.score-a.score||T.indexOf(a.tier)-T.indexOf(b.tier)||a.date.localeCompare(b.date));
function repH(){const L=per(),t=pm=='m'?`${MN[pmo-1]} ${fa(py)}`:`سال ${fa(py)}`;
if(!L.length)return `<h2>${t}</h2><p class="h">توی این بازه کتابی ثبت نشده.</p>`;
const w=L[0],avg=Math.round(L.reduce((a,f)=>a+f.score,0)/L.length*10)/10;
return `<h2>🏆 کتاب‌های برتر ${t}</h2><div class="win"><div class="po" ${bg(w.poster)}></div><div><small>کتاب برتر</small><h3>${esc(w.title)}</h3><p style="margin:2px 0">${sc(w.score)} از ۱۰ · رتبه ${w.tier}${w.director?' · '+esc(w.director):''}</p><p class="h">${esc(w.line)}</p></div></div>
<ol>${L.map((f,i)=>`<li><span>${fa(i+1)}</span><div class="po" ${bg(f.poster)}></div><b>${esc(f.title)}</b><span class="chip" style="background:${TC[f.tier]}">${f.tier}</span><span>${sc(f.score)}</span></li>`).join('')}</ol><p class="h">${fa(L.length)} کتاب · میانگین نمره ${sc(avg)}</p>`}
function topV(){const t=J(today());py=py||t.y;pmo=pmo||t.m;
const ys=[...new Set([t.y,py,...F.map(f=>J(parse(f.date)).y)])].sort(),o=(v,c)=>v==c?' selected':'';
return `<div class="row"><select id="pt" style="width:auto"><option value="m"${o(pm,'m')}>ماهانه</option><option value="y"${o(pm,'y')}>سالانه</option></select>${pm=='m'?`<select id="pmo" style="width:auto">${MN.map((n,i)=>`<option value="${i+1}"${o(pmo,i+1)}>${n}</option>`).join('')}</select>`:''}<select id="py" style="width:auto">${ys.map(y=>`<option value="${y}"${o(py,y)}>${fa(y)}</option>`).join('')}</select></div>
<div class="rep" id="rep">${repH()}</div><div class="row"><button class="b" id="rpng">⬇ دانلود عکس (PNG)</button><button class="s" id="rpdf">⬇ دانلود PDF</button></div>`}
const arc=()=>`<h2>آرشیو و پشتیبان</h2><div class="row"><button class="b" id="apdf">⬇ PDF همه‌چیز (جلد، مشخصات، نقد، نمره)</button><button class="s" id="ajs">⬇ پشتیبان کامل (JSON با عکس‌ها)</button><label class="s" style="margin:0;color:inherit;font-size:inherit">⬆ بارگذاری فایل قبلی (PDF یا JSON)<input type="file" id="imp" accept=".pdf,.json" hidden></label></div>
<p class="h">PDF همه متن‌ها، رتبه‌ها و نمره‌ها رو داخل خودش داره و اگه دوباره آپلودش کنی تاریخچه‌ت برمی‌گرده (بدون عکس‌ها). برای بازیابی کامل با عکس‌ها از فایل JSON استفاده کن. اطلاعات فقط روی همین مرورگر ذخیره می‌شه، پس هر از گاهی پشتیبان بگیر.</p>`;
function R(){$('#nav').innerHTML=[['board','تیرلیست'],['cal','تقویم'],['top','برترین‌ها'],['arc','آرشیو']].map(([k,l])=>`<button data-tab="${k}" class="${tab==k?'on':''}">${l}</button>`).join('');
$('#m').innerHTML=tab=='board'?`<div id="bd">${boardH()}</div>${F.length?'':'<p class="h">هنوز کتابی نداری؛ از «+ کتاب جدید» شروع کن.</p>'}<p class="h">برای تغییر رتبه، جلد رو بکش روی ردیف دیگه (یا از فرم ویرایش). برای جزئیات روی جلد بزن.</p><button class="b" id="bpng">⬇ دانلود عکس تیرلیست</button>`:tab=='cal'?cal():tab=='top'?topV():arc()}
/* modal */
function modal(h){const m=$('#mod');m.innerHTML=`<div class="sh"><button class="x">✕</button>${h}</div>`;m.hidden=false}
const close=()=>{$('#mod').hidden=true;delId=null};
function detail(id){const f=F.find(x=>x.id==id);if(!f)return;
modal(`<div class="dt"><div class="po" ${bg(f.poster)}></div><div><h2>${esc(f.title)}</h2><p class="h">${fj(f.date)}</p><p style="margin:4px 0">✍️ ${esc(f.director)||'—'}${f.trn?' · مترجم: '+esc(f.trn):''}</p><p class="h">${[f.kind,f.pub,f.yr&&('سال '+f.yr),f.pg&&(f.pg+' صفحه')].filter(Boolean).map(esc).join(' · ')}</p><span class="chip" style="background:${TC[f.tier]}">${f.tier}</span> <b>${sc(f.score)} از ۱۰</b></div></div>
${f.line?`<blockquote>${esc(f.line)}</blockquote>`:''}<p class="rv">${esc(f.review)}</p>
<div class="row"><button class="b" data-e="${f.id}">ویرایش</button><button class="d" data-x="${f.id}">حذف</button></div>`)}
function day(s){const fs=F.filter(f=>f.date==s);
modal(`<h2>${fj(s)}</h2>${fs.map(f=>`<div class="row" style="cursor:pointer" data-id="${f.id}"><div class="po" style="width:40px;background-image:url('${f.poster||''}')"></div><b style="flex:1">${esc(f.title)}</b><span class="chip" style="background:${TC[f.tier]}">${f.tier}</span><span>${sc(f.score)}</span></div>`).join('')||'<p class="h">کتابی ثبت نشده.</p>'}<button class="b" data-nd="${s}">+ کتاب در این روز</button>`)}
const ph=(k,u,l)=>`<label class="ph${u?' on':''}" data-k="${k}" ${bg(u)}><span>${l}</span><input type="file" accept="image/*" hidden></label>`;
function form(f,dt){cur=f?JSON.parse(JSON.stringify(f)):{id:''+Date.now(),date:dt||iso(today()),actors:[{},{},{}],tier:'B',score:7};
const j=J(parse(cur.date)),t=J(today()).y,ys=[];for(let y=t-8;y<=t+1;y++)ys.push(y);if(!ys.includes(j.y))ys.push(j.y);
const op=(a,v,fn)=>a.map(x=>`<option value="${x}"${x==v?' selected':''}>${fn(x)}</option>`).join(''),rg=n=>[...Array(n)].map((_,i)=>i+1);
modal(`<h2>${f?'ویرایش کتاب':'کتاب جدید'}</h2><div class="r2">${ph('p',cur.poster,'جلد')}<div style="flex:1"><label>اسم کتاب</label><input id="ft" value="${esc(cur.title)}"><label>نویسنده</label><input id="fd" value="${esc(cur.director)}"><label>مترجم (اختیاری)</label><input id="ftr" value="${esc(cur.trn)}"></div></div>
<label>تاریخ خوندن (شمسی)</label><div class="g3"><select id="fday">${op(rg(31),j.d,fa)}</select><select id="fm">${op(rg(12),j.m,x=>MN[x-1])}</select><select id="fy">${op(ys,j.y,fa)}</select></div>
<div class="g3" style="grid-template-columns:1fr 1fr"><div><label>نوع</label><select id="fk">${op(['کتاب','رمان','مجموعه داستان','شعر','مقاله','پایان‌نامه','مجله','دیگر'],cur.kind,x=>x)}</select></div><div><label>انتشارات / نشریه</label><input id="fpub" value="${esc(cur.pub)}"></div><div><label>سال نشر</label><input id="fyr" inputmode="numeric" value="${esc(cur.yr)}"></div><div><label>تعداد صفحه</label><input id="fpg" inputmode="numeric" value="${esc(cur.pg)}"></div></div>
<div class="g3" style="grid-template-columns:1fr 1fr"><div><label>رتبه در تیرلیست</label><select id="fti">${op(T,cur.tier,x=>x)}</select></div><div><label>نمره (۰ تا ۱۰)</label><input id="fsc" type="number" inputmode="decimal" min="0" max="10" step="0.1" value="${cur.score}"></div></div>
<label>یک جمله درباره‌ش</label><input id="fln" value="${esc(cur.line)}"><label>نقد</label><textarea id="frv" rows="5">${esc(cur.review)}</textarea><button class="b" id="sv" style="width:100%;margin-top:12px">ذخیره</button>`)}
/* export */
function cap(h){const b=document.createElement('div');b.className='cap';b.style.cssText='position:fixed;left:-9999px;top:0;width:760px';b.innerHTML=h;document.body.appendChild(b);return b}
async function snap(h,name){toast('در حال ساخت عکس…');const b=cap(h);try{await document.fonts.ready;const c=await html2canvas(b,{scale:2,backgroundColor:'#0e3a5f',onclone:d=>{const x=d.querySelector('.cap');if(x)x.style.left='0'}});b.remove();c.toBlob(x=>dl(name,x))}catch(e){b.remove();toast('ساخت عکس ناموفق بود')}}
const fb=f=>`<section class="fb"><div class="po" ${bg(f.poster)}></div><div class="fi"><h2>${esc(f.title)} <span class="chip" style="background:${TC[f.tier]}">${f.tier}</span> ${sc(f.score)}/۱۰</h2><p class="h">${fj(f.date)} · نویسنده: ${esc(f.director)||'—'}${f.trn?' · مترجم: '+esc(f.trn):''} · ${[f.kind,f.pub,f.yr,f.pg&&f.pg+' صفحه'].filter(Boolean).map(esc).join(' · ')}</p>${f.line?`<blockquote>${esc(f.line)}</blockquote>`:''}<p class="rv">${esc(f.review)}</p></div></section>`;
async function pdf(secs,name,data){toast('در حال ساخت PDF…');const b=cap(secs);try{await document.fonts.ready;const{jsPDF}=window.jspdf,d=new jsPDF({unit:'pt',format:'a4'}),W=d.internal.pageSize.getWidth(),H=d.internal.pageSize.getHeight();let y=0;
for(const s of b.children){const c=await html2canvas(s,{scale:1.5,backgroundColor:'#0e3a5f',onclone:d=>{const x=d.querySelector('.cap');if(x)x.style.left='0'}});let w=W,h=W*c.height/c.width;if(h>H){w=W*H/h;h=H}if(y&&y+h>H){d.addPage();y=0}d.addImage(c.toDataURL('image/jpeg',.85),'JPEG',(W-w)/2,y,w,h);y+=h}
if(data)d.setProperties({title:'Lamp',keywords:'LMP1'+btoa(unescape(encodeURIComponent(JSON.stringify(data))))});
b.remove();dl(name,d.output('blob'))}catch(e){b.remove();toast('ساخت PDF ناموفق بود')}}
async function imp(file){try{let a;if(/\.json$/i.test(file.name))a=JSON.parse(await file.text()).films;else{const t=new TextDecoder('latin1').decode(await file.arrayBuffer()),m=t.match(/LMP1([A-Za-z0-9+\/=]+)/);if(!m)throw 0;a=JSON.parse(decodeURIComponent(escape(atob(m[1]))))}
a.forEach(x=>{x.actors=[0,1,2].map(i=>x.actors?.[i]||{});const i=F.findIndex(f=>f.id==x.id);if(i<0)return F.push(x);const o=F[i];F[i]={...x,poster:x.poster||o.poster,actors:x.actors.map((q,k)=>({...q,photo:q.photo||o.actors[k]?.photo}))}});
await save();R();toast(fa(a.length)+' کتاب بازیابی شد')}catch(e){toast('این فایل خونده نشد')}}
/* events */
document.addEventListener('click',async e=>{const t=e.target,c=s=>t.closest(s);
if(c('#add'))return form();
if(c('.x')||t.id=='mod')return close();
let el;
if(el=c('[data-tab]')){tab=el.dataset.tab;return R()}
if(el=c('[data-n]')){cm+=+el.dataset.n;if(cm>12){cm=1;cy++}if(cm<1){cm=12;cy--}return R()}
if(el=c('[data-nd]')){return form(null,el.dataset.nd)}
if(el=c('[data-e]'))return form(F.find(f=>f.id==el.dataset.e));
if(el=c('[data-x]')){if(delId!=el.dataset.x){delId=el.dataset.x;el.textContent='مطمئنی؟ دوباره بزن';return}F=F.filter(f=>f.id!=delId);await save();close();return R()}
if(el=c('.dy'))return day(el.dataset.d);
if(el=c('[data-id]'))return detail(el.dataset.id);
if(c('#sv')){cur.title=$('#ft').value.trim();if(!cur.title)return toast('اسم کتاب رو بنویس');cur.director=$('#fd').value.trim();cur.trn=$('#ftr').value.trim();cur.kind=$('#fk').value;cur.pub=$('#fpub').value.trim();cur.yr=$('#fyr').value.trim();cur.pg=$('#fpg').value.trim();
cur.date=iso(j2g(+$('#fy').value,+$('#fm').value,+$('#fday').value));document.querySelectorAll('.an').forEach((x,i)=>cur.actors[i].name=x.value.trim());
cur.tier=$('#fti').value;cur.score=Math.min(10,Math.max(0,+$('#fsc').value||0));cur.line=$('#fln').value.trim();cur.review=$('#frv').value.trim();
const i=F.findIndex(f=>f.id==cur.id);i<0?F.push(cur):F[i]=cur;await save();close();return R()}
if(c('#bpng'))return snap(`<h1 style="margin:0 0 10px">💡 چراغ مطالعه · تیرلیست من</h1>${boardH()}`,'lamp-tierlist.png');
if(c('#rpng'))return snap($('#rep').innerHTML,pm=='m'?`top-${py}-${pmo}.png`:`top-${py}.png`);
if(c('#rpdf'))return pdf(`<section style="padding:20px">${$('#rep').innerHTML}</section>`,pm=='m'?`top-${py}-${pmo}.pdf`:`top-${py}.pdf`);
if(c('#apdf')){if(!F.length)return toast('اول کتاب اضافه کن');const L=[...F].sort((a,b)=>a.date.localeCompare(b.date));
return pdf(`<section style="padding:20px"><h1 style="margin:0">💡 چراغ مطالعه · دفتر کتاب‌های من</h1><p class="h">${fa(F.length)} کتاب · ${fj(iso(today()))}</p>${boardH()}</section>`+L.map(fb).join(''),'lamp-films.pdf',F.map(f=>({...f,poster:'',actors:f.actors.map(a=>({name:a.name}))})))}
if(c('#ajs')){if(!F.length)return toast('کتابی برای پشتیبان نیست');return dl('lamp-backup.json',JSON.stringify({v:1,films:F}))}
});
document.addEventListener('change',async e=>{const t=e.target;
if(t.id=='imp'&&t.files[0]){await imp(t.files[0]);t.value='';return}
if(t.id=='pt'){pm=t.value;return R()}if(t.id=='pmo'){pmo=+t.value;return R()}if(t.id=='py'){py=+t.value;return R()}
if(t.type=='file'&&t.files[0]){const l=t.closest('.ph'),k=l.dataset.k,u=await img(t.files[0],k=='p'?520:240);if(!u)return;k=='p'?cur.poster=u:cur.actors[+k[1]].photo=u;l.style.backgroundImage=`url('${u}')`;l.classList.add('on')}});
let dragId;
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('.fc');if(c){dragId=c.dataset.id;e.dataTransfer.setData('text/plain',dragId)}});
document.addEventListener('dragover',e=>{const z=e.target.closest?.('.tz');if(z){e.preventDefault();z.classList.add('ov')}});
document.addEventListener('dragleave',e=>e.target.closest?.('.tz')?.classList.remove('ov'));
document.addEventListener('drop',async e=>{const z=e.target.closest?.('.tz');if(!z||!dragId)return;e.preventDefault();const f=F.find(x=>x.id==dragId);dragId=null;if(f&&f.tier!=z.dataset.t){f.tier=z.dataset.t;await save()}R()});
load().then(a=>{F=a;R()});R();
(()=>{const i=$('#intro'),o=()=>{i.classList.add('out');setTimeout(()=>i.remove(),800)};setTimeout(()=>i.classList.add('turn'),700);setTimeout(()=>i.classList.add('lit'),1500);setTimeout(o,2600);i.onclick=o})();
</script></body></html>
