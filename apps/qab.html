const F=[['name','نام پروژه (نام کاری برای صدا زدن)'],['title','تایتل پروژه (عنوان نهایی روی تیتراژ)'],['en','عنوان انگلیسی / بین‌المللی'],['type','نوع اثر','s',['فیلم بلند','فیلم کوتاه','سریال','مستند','تیزر / موزیک‌ویدیو','انیمیشن']],['genre','ژانر'],['dur','مدت (دقیقه)'],['lang','زبان'],['status','وضعیت','s',['ایده','فیلمنامه','پیش‌تولید','تولید','پس‌تولید','اکران']],['dir','کارگردان'],['prod','تهیه‌کننده'],['writer','نویسنده'],['co','شرکت تولید'],['start','تاریخ شروع (مثلاً ۱۴۰۵/۰۸/۲۳)'],['end','تاریخ پایان'],['loc','لوکیشن‌ها'],['fmt','دوربین / فرمت'],['ratio','نسبت تصویر'],['year','سال تولید'],['budget','بودجهٔ برآوردی']];
function field([k,l,t,o]){const p='info.'+k;return `<div><label>${l}</label>${t=='s'?`<select data-p="${p}"><option value="">—</option>${o.map(x=>`<option ${rd(p)==x?'selected':''}>${x}</option>`).join('')}</select>`:inp(p)}</div>`}
function node(n){const i=P().crew.indexOf(n),ch=P().crew.filter(c=>c.p==n.id);return `<li><div class=nd>${inp(`crew.${i}.title`,'placeholder="عنوان سمت (مثلاً مدیر فیلمبرداری)"','t')}${ta(`crew.${i}.names`,'نام افراد (هر نام در یک خط)',1)}<div class=bt><button data-a=addc data-i=${n.id}>＋ زیرمجموعه</button><button class=x data-a=delc data-i=${n.id}>${armed=='c'+n.id?'مطمئنید؟':'حذف'}</button></div></div>${ch.length?`<ul>${ch.map(node).join('')}</ul>`:''}</li>`}
const kids=id=>{let r=[id];P().crew.filter(c=>c.p==id).forEach(c=>r=r.concat(kids(c.id)));return r};
const cnt=n=>(n.names||'').split('\n').filter(x=>x.trim()).length;
const heads=()=>P().crew.filter(c=>!c.p).map(c=>[c.title||'—',kids(c.id).reduce((a,id)=>a+cnt(P().crew.find(x=>x.id==id)),0),'#00e054']);
function chart(items){const mx=Math.max(1,...items.map(i=>Math.abs(i[1])));return `<div class=ch>${items.map(([l,v,c])=>`<div class=cr><span>${esc(l)}</span><div class=cb><i style="width:${Math.round(Math.abs(v)/mx*100)}%;background:${c}"></i></div><b>${nf(v)}</b></div>`).join('')||'<p class=m>داده‌ای برای نمودار نیست.</p>'}</div>`}
function exp(tab){return `<div class=card><h2>خروجی PDF</h2><div class=row><label>اندازه</label><select data-s=sz>${['a4','a3','a5','letter'].map(x=>`<option value=${x} ${S.sz==x?'selected':''}>${x.toUpperCase()}</option>`).join('')}</select><select data-s=or><option value=portrait ${S.or=='portrait'?'selected':''}>عمودی</option><option value=landscape ${S.or=='landscape'?'selected':''}>افقی</option></select><button class=pri data-a=pdf data-i=${tab}>دانلود PDF این بخش</button>${tab=='fin'?'<button data-a=inv>دانلود صورت‌حساب</button>':''}</div></div>`}
function info(){const p=P();return `<div class=card><h2>مشخصات پروژه</h2><div class=grid>${F.map(field).join('')}</div><div style="margin-top:10px"><label>لاگ‌لاین</label>${ta('info.logline','داستان در یک یا دو جمله',2)}<label>خلاصهٔ داستان</label>${ta('info.synopsis','',5)}<label>یادداشت‌ها</label>${ta('info.notes','',3)}</div></div>
<div class=card><h2>پوستر و فیلمنامه</h2><div class=row style="align-items:flex-start;gap:20px"><div>${p.info.poster?`<img class=poster src="${p.info.poster}">`:''}<label>آپلود پوستر</label><input type=file accept="image/*" data-f=poster></div><div style="flex:1"><label>آپلود فیلمنامه (PDF / Word / متن)</label><input type=file data-f=script>${p.info.scriptName?`<p class=m>فایل: ${esc(p.info.scriptName)}${p.info.script?'':' (حجم زیاد؛ فقط نام ذخیره شد)'}</p>`:''}</div></div></div>`+exp('info')}
function ocNode(n,d){const ch=P().crew.filter(c=>c.p==n.id);return `<li><div class="bx d${Math.min(d,2)}"><b>${esc(n.title||'—')}</b>${(n.names||'').split('\n').filter(x=>x.trim()).map(x=>`<span>${esc(x)}</span>`).join('')}</div>${ch.length?`<ul>${ch.slice().reverse().map(c=>ocNode(c,d+1)).join('')}</ul>`:''}</li>`}
function ocart(){const p=P(),tops=p.crew.filter(c=>!c.p);if(!tops.length)return '<p class=m>هنوز گروهی نساخته‌اید؛ از بخش «ویرایش عوامل» پایین صفحه شروع کنید.</p>';return `<div class=oc><ul><li><div class="bx d0"><b>${esc(p.info.title||p.info.name||'پروژه')}</b>${p.info.dir?`<span>کارگردان: ${esc(p.info.dir)}</span>`:''}</div><ul>${tops.slice().reverse().map(c=>ocNode(c,1)).join('')}</ul></li></ul></div>`}
function crew(){const p=P();return `<div class=card><h2>نمودار سازمانی</h2>${ocart()}</div><div class=card><h2>ویرایش عوامل</h2><p class=m>گروه اصلی بسازید و با «زیرمجموعه» سمت‌ها را زیر هم بگذارید.</p><div class=row style="margin-bottom:8px"><button class=pri data-a=addr>＋ گروه جدید</button><button data-a=seed>افزودن گروه‌های پیش‌فرض</button></div><ul class=tree>${p.crew.filter(c=>!c.p).map(node).join('')}</ul></div><div class=card><h2>نمودار تعداد عوامل هر گروه</h2>${chart(heads())}</div>`+exp('crew')}
// planning
function whoList(){return [{id:'gen',l:'عمومی (کل پروژه)'},...P().crew.filter(c=>c.title||c.names).map(c=>({id:c.id,l:(c.title||'—')+(c.names?' · '+c.names.split('\n')[0]:'')}))]}
const wl=w=>(whoList().find(x=>x.id==w)||{}).l||'';
const tm=s=>{const[h,m]=(s||'0:0').split(':');return +h*60+ +m};
const weeksOf=(jy,jm)=>{let s=ws(J(jy,jm,1)),e=J(jy,jm,mdays(jy,jm)),r=[];while(s<=e){r.push(s);s=add(s,7)}return r};
const cntM=(w,jy,jm)=>{let n=0;for(let i=1;i<=mdays(jy,jm);i++)n+=rd(`plan.${w}.d.${iso(J(jy,jm,i))}`,[]).length;return n};
function cal(jy,jm,w){const f=J(jy,jm,1);let c=WS.map(x=>`<div class=h0>${x}</div>`).join('')+'<div></div>'.repeat(wi(f));for(let i=1;i<=mdays(jy,jm);i++){const k=iso(J(jy,jm,i)),n=rd(`plan.${w}.d.${k}`,[]).length;c+=`<div class="cd ${k==S.date?'on':''}" data-a=goto data-i=${k}>${fd(i)}${n?`<em>${fd(n)}</em>`:''}</div>`}return `<div class=cal>${c}</div>`}
function stats(w){const c={plan:0,doing:0,done:0,cancel:0};Object.values(rd(`plan.${w}.d`,{})).forEach(L=>L.forEach(t=>c[t.st||'plan']++));return Object.keys(ST).map(k=>[ST[k],c[k],SC[k]])}
function plan(){const w=S.who,d=pd(S.date),[jy,jm,jd]=jdt(d),base=`plan.${w}.`,pv=S.pv;let lab='',h='';
if(pv=='day'){lab=dl(S.date);const k=base+'d.'+S.date,L=get(k,()=>[]);L.sort((a,b)=>(a.from||'').localeCompare(b.from||''));
h=`<div class=tl>${L.filter(t=>t.from&&t.to).map(t=>`<i title="${esc(t.title)}" style="right:${Math.max(0,(tm(t.from)-360)/10.8)}%;width:${Math.max(1,(tm(t.to)-tm(t.from))/10.8)}%;background:${SC[t.st||'plan']}"></i>`).join('')}</div><div class=tk>${[6,9,12,15,18,21,24].map(x=>`<span>${fd(x)}</span>`).join('')}</div>`+
L.map((t,i)=>`<div class=it style="border-color:${SC[t.st||'plan']}"><div class=tm><input type=time data-r=1 data-p="${k}.${i}.from" value="${t.from||''}"><span>تا</span><input type=time data-r=1 data-p="${k}.${i}.to" value="${t.to||''}">${sel(`${k}.${i}.st`,ST,t.st||'plan',1)}<button class=x data-a=deli data-i="${k}.${i}">✕</button></div>${inp(`${k}.${i}.title`,'placeholder="عنوان کار"')}${inp(`${k}.${i}.loc`,'placeholder="مکان / لوکیشن"')}${ta(`${k}.${i}.desc`,'توضیحات دقیق کار…',3)}${t.st=='done'?ta(`${k}.${i}.res`,'نحوهٔ انجام شدن کار و توضیحات پس از انجام…',3):''}</div>`).join('')+`<button class=pri data-a=addi data-i="${k}">＋ کار جدید</button>`}
if(pv=='week'){const s=ws(d),k=base+'w.'+iso(s),L=get(k,()=>[]);lab=`هفتهٔ ${dl(iso(s))} تا ${dl(iso(add(s,6)))}`;
h=`<div class=wg>${WD.map((n,di)=>{const[,m2,d2]=jdt(add(s,di));return `<div class=wc><b>${n} <small>${fd(d2)} ${MN[m2-1]}</small></b>`+L.map((t,i)=>t.day==di?`<div class=wk><button class="star ${t.star?'on':''}" data-a=star data-i="${k}.${i}">★</button><input type=checkbox data-r=1 data-p="${k}.${i}.done" ${t.done?'checked':''}><button class=x data-a=deli data-i="${k}.${i}">✕</button><textarea rows=2 style="${t.done?'text-decoration:line-through;opacity:.6':''}" data-p="${k}.${i}.text">${esc(t.text)}</textarea></div>`:'').join('')+`<button data-a=addw data-i="${k}" data-d=${di}>＋</button></div>`}).join('')}</div>`}
if(pv=='month'){lab=`${MN[jm-1]} ${fd(jy)}`;const k=base+'m.'+jy+'-'+jm;h=cal(jy,jm,w)+'<h2>عنوان هفته‌ها</h2>'+weeksOf(jy,jm).map(s=>`<div class=wk><span style="min-width:120px">${fd(jdt(s)[2])} ${MN[jdt(s)[1]-1]} ←</span>${inp(k+'.'+iso(s),'placeholder="عنوان هفته"')}</div>`).join('')}
if(pv=='year'){lab=fd(jy);const k=base+'y.'+jy;h='<div class=grid>'+MN.map((n,i)=>`<div><label>${n} · ${fd(cntM(w,jy,i+1))} کار</label>${inp(k+'.'+i,'placeholder="تایتل ماه"')}</div>`).join('')+'</div>'}
const pk=pv=='day'?'':'';
return `<div class=card><div class=chips>${whoList().map(x=>`<button class="${x.id==w?'on':''}" data-a=who data-i=${x.id}>${esc(x.l)}</button>`).join('')}</div><div class=tabs style="margin-top:0">${[['day','روزانه'],['week','هفتگی'],['month','ماهانه'],['year','سالانه']].map(([k,l])=>`<button class="${pv==k?'on':''}" data-a=pv data-i=${k}>${l}</button>`).join('')}</div>
<div class=nav><button data-a=nav data-i=1>▶</button><b>${lab}</b><button data-a=nav data-i=-1>◀</button><div class=jp><input type=number data-j=y value="${jy}"><select data-j=m>${MN.map((n,i)=>`<option value=${i+1} ${i+1==jm?'selected':''}>${n}</option>`).join('')}</select><input type=number data-j=d min=1 max=31 value="${jd}"></div><button data-a=today>امروز</button></div>${h}</div>
<div class=card><h2>نمودار وضعیت کارهای «${esc(wl(w))}»</h2>${chart(stats(w))}</div>`+exp('plan')}
// finance
const FK=[['exp','هزینه‌ها'],['inc','درآمدها'],['cap','سرمایه‌ها']];
function finT(){const f=P().fin||{},T={};FK.forEach(([k])=>T[k]=(f[k]||[]).reduce((a,r)=>a+(+r.amt||0),0));T.net=T.inc+T.cap-T.exp;return T}
function fin(){const f=get('fin'),T=finT(),u=esc(f.unit||'تومان');return `<div class=card><div class=row><label>واحد پول</label><input style="width:120px" data-p="fin.unit" value="${u}"></div></div>`+FK.map(([k,l])=>{const L=get('fin.'+k,()=>[]);return `<div class=card><h2>${l}</h2>${L.map((r,i)=>`<div class=fr>${inp(`fin.${k}.${i}.title`,'placeholder="تایتل"')}${inp(`fin.${k}.${i}.desc`,'placeholder="توضیحات"')}<input type=number data-r=1 data-p="fin.${k}.${i}.amt" value="${r.amt??''}" placeholder="مبلغ"><button class=x data-a=deli data-i="fin.${k}.${i}">✕</button></div>`).join('')}<div class=row><button class=pri data-a=addf data-i=${k}>＋ افزودن</button><b style="margin-inline-start:auto">جمع: ${nf(T[k])} ${u}</b></div></div>`}).join('')+`<div class=sum>مانده نهایی = (درآمد + سرمایه) − هزینه = ${nf(T.net)} ${u}</div><div class=card style="margin-top:14px"><h2>نمودار مالی</h2>${chart([['هزینه‌ها',T.exp,'#ff8000'],['درآمدها',T.inc,'#00e054'],['سرمایه‌ها',T.cap,'#40bcf4'],['مانده',T.net,T.net<0?'#ff8000':'#00e054']])}</div>`+exp('fin')}
// media
const fsz=n=>n>1e6?nf(Math.round(n/1e5)/10)+' مگابایت':nf(Math.round(n/1e3))+' کیلوبایت';
const mcnt=()=>MC.map(([c,l])=>[l,P().media.filter(m=>m.cat==c).length,'#40bcf4']);
function media(){return MC.map(([c,l])=>{const L=P().media.filter(m=>m.cat==c);return `<div class=card><h2>${l} <small>(${nf(L.length)})</small></h2><input type=file multiple accept="video/*,image/*,audio/*,.pdf" data-f=media data-c=${c}><div class=mg>${L.map(m=>`<div class=mi>${m.type.startsWith('video')?`<video controls preload=metadata data-m=${m.id}></video>`:m.type.startsWith('image')?`<img data-m=${m.id}>`:`<div class=ic>${esc(m.name.split('.').pop())}</div>`}<p title="${esc(m.name)}">${esc(m.name)}</p><span>${fsz(m.size)}</span> <button class=x data-a=delm data-i=${m.id}>حذف</button></div>`).join('')}</div></div>`}).join('')+`<div class=card><h2>نمودار تعداد فایل‌ها</h2>${chart(mcnt())}<p class=m>فایل‌ها فقط در مرورگر همین دستگاه ذخیره می‌شوند؛ برای نسخهٔ پشتیبان «دانلود کل پروژه» را بزنید.</p></div>`+exp('media')}
function proj(){const p=P();return `<div class=row><button data-a=home>→ پروژه‌ها</button><h1 style="flex:1">${esc(p.info.title||p.info.name||'پروژهٔ بدون نام')}</h1><button data-a=expj data-i=${p.id}>JSON</button><button class=pri data-a=zip>دانلود کل پروژه (ZIP)</button></div>
<div class=tabs>${[['info','مشخصات'],['crew','چارت عوامل'],['plan','برنامه‌ریزی'],['fin','خرج و مخارج'],['media','رسانه']].map(([k,l])=>`<button class="${S.tab==k?'on':''}" data-a=tab data-i=${k}>${l}</button>`).join('')}</div>${({info,crew,plan,fin,media})[S.tab]()}`}
// reports
const T=(h,rows)=>`<table class=rt><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x).replace(/\n/g,'<br>')}</td>`).join('')}</tr>`).join('')}</table>`;
const RH=t=>`<div class=rb><i></i><i></i><i></i><i></i></div><h1>${esc(P().info.title||P().info.name||'')}</h1><p>${esc(t)} · ${dl(iso(new Date()))}</p>`;
const flat=(id='',dp=0)=>P().crew.filter(c=>(c.p||'')==id).flatMap(c=>[['— '.repeat(dp)+c.title,(c.names||'').replace(/\n/g,'، ')],...flat(c.id,dp+1)]);
const repInfo=()=>RH('شناسنامهٔ پروژه')+T(['مورد','مقدار'],F.map(f=>[f[1],P().info[f[0]]||'—']))+`<h2>لاگ‌لاین</h2><p>${esc(P().info.logline||'—')}</p><h2>خلاصه</h2><p>${esc(P().info.synopsis||'—')}</p>`;
const repCrew=()=>RH('چارت عوامل')+ocart()+T(['سمت','نام‌ها'],flat())+chart(heads());
const dayRows=L=>L.map(t=>[`${t.from||''} تا ${t.to||''}`,t.title,t.loc,ST[t.st||'plan'],t.desc,t.res]);
const DH=['ساعت','کار','مکان','وضعیت','توضیحات','نحوهٔ انجام'];
function repPlan(){const w=S.who,d=pd(S.date),[jy,jm]=jdt(d);let b='';
if(S.pv=='day')b=`<h2>${dl(S.date)}</h2>`+T(DH,dayRows(rd(`plan.${w}.d.${S.date}`,[])));
if(S.pv=='week'){const s=ws(d);b=`<h2>هفتهٔ ${dl(iso(s))}</h2>`+T(['روز','کار','مهم','انجام'],rd(`plan.${w}.w.${iso(s)}`,[]).slice().sort((a,c)=>a.day-c.day).map(t=>[WD[t.day],t.text,t.star?'★':'',t.done?'✓':'']))}
if(S.pv=='month')b=`<h2>${MN[jm-1]} ${fd(jy)}</h2>`+cal(jy,jm,w)+T(['هفته','عنوان'],weeksOf(jy,jm).map(s=>[dl(iso(s)),rd(`plan.${w}.m.${jy}-${jm}.${iso(s)}`)]));
if(S.pv=='year')b=`<h2>سال ${fd(jy)}</h2>`+T(['ماه','تایتل','تعداد کار'],MN.map((n,i)=>[n,rd(`plan.${w}.y.${jy}.${i}`),fd(cntM(w,jy,i+1))]));
return RH('برنامهٔ '+wl(w))+b+'<h2>وضعیت کارها</h2>'+chart(stats(w))}
function repPlanAll(w){const pl=rd('plan.'+w,{});let b='';Object.keys(pl.y||{}).sort().forEach(y=>b+=`<h2>سال ${fd(y)}</h2>`+T(['ماه','تایتل'],MN.map((n,i)=>[n,pl.y[y][i]])));
Object.keys(pl.m||{}).sort().forEach(k=>{const[y,m]=k.split('-');b+=`<h2>${MN[m-1]} ${fd(y)}</h2>`+T(['هفته','عنوان'],Object.entries(pl.m[k]).map(([s,t])=>[dl(s),t]))});
Object.keys(pl.w||{}).sort().forEach(k=>{if(pl.w[k].length)b+=`<h2>هفتهٔ ${dl(k)}</h2>`+T(['روز','کار','مهم','انجام'],pl.w[k].slice().sort((a,c)=>a.day-c.day).map(t=>[WD[t.day],t.text,t.star?'★':'',t.done?'✓':'']))});
Object.keys(pl.d||{}).sort().forEach(k=>{if(pl.d[k].length)b+=`<h2>${dl(k)}</h2>`+T(DH,dayRows(pl.d[k]))});return b?RH('برنامهٔ کامل — '+wl(w))+b+'<h2>وضعیت کارها</h2>'+chart(stats(w)):''}
const finTables=()=>{const f=P().fin||{},u=f.unit||'تومان';return FK.map(([k,l])=>`<h2>${l}</h2>`+T(['تایتل','توضیحات','مبلغ ('+u+')'],(f[k]||[]).map(r=>[r.title,r.desc,nf(r.amt)]).concat([['جمع','',nf(finT()[k])]]))).join('')};
const repFin=()=>{const T0=finT();return RH('گزارش مالی')+finTables()+`<h2>مانده نهایی</h2><p><b>${nf(T0.net)} ${esc(P().fin?.unit||'تومان')}</b></p>`+chart([['هزینه‌ها',T0.exp,'#ff8000'],['درآمدها',T0.inc,'#00b844'],['سرمایه‌ها',T0.cap,'#40bcf4'],['مانده',T0.net,'#556677']])};
const repInv=()=>{const T0=finT(),u=P().fin?.unit||'تومان';return RH('صورت‌حساب مالی')+finTables()+`<h2>خلاصه</h2>`+T(['شرح','مبلغ ('+u+')'],[['جمع درآمدها',nf(T0.inc)],['جمع سرمایه‌ها',nf(T0.cap)],['جمع هزینه‌ها',nf(T0.exp)],['مانده نهایی (درآمد + سرمایه − هزینه)',nf(T0.net)]])};
const repMedia=()=>RH('فهرست رسانه')+T(['دسته','نام فایل','حجم'],MC.flatMap(([c,l])=>P().media.filter(m=>m.cat==c).map(m=>[l,m.name,fsz(m.size)])))+chart(mcnt());

async function toPdf(secs,size,or){await (document.fonts?.ready);const pdf=new jspdf.jsPDF({orientation:or,unit:'mm',format:size});const W=pdf.internal.pageSize.getWidth(),H=pdf.internal.pageSize.getHeight(),m=8,w=W-2*m;let first=true;
for(const h of secs){if(!h)continue;const el=document.createElement('div');el.className='rp';el.style.width=Math.round(w*3.78)+'px';el.innerHTML=h;document.body.appendChild(el);let c;try{c=await html2canvas(el,{scale:1.6,backgroundColor:'#fff'})}finally{el.remove()}
const sh=(H-2*m)*c.width/w;for(let y=0;y<c.height-1;y+=sh){const s=document.createElement('canvas');s.width=c.width;s.height=Math.min(sh,c.height-y);s.getContext('2d').drawImage(c,0,y,c.width,s.height,0,0,c.width,s.height);if(!first)pdf.addPage();first=false;pdf.addImage(s.toDataURL('image/jpeg',.9),'JPEG',m,m,w,s.height*w/c.width)}}return pdf}

function imp(o){(Array.isArray(o)?o:[o]).forEach(p=>{if(!p||!p.info)return;p.crew=p.crew||[];p.plan=p.plan||{};p.fin=p.fin||{};p.media=p.media||[];const i=S.projects.findIndex(x=>x.id==p.id);i<0?S.projects.push(p):S.projects[i]=p});save()}

else if(a=='delc'){if(!sure('c'+i))return;const ids=kids(i);P().crew=P().crew.filter(c=>!ids.includes(c.id))}
else if(a=='seed'){[['کارگردانی',['دستیار اول کارگردان','منشی صحنه','برنامه‌ریز']],['تهیه و تولید',['مدیر تولید','دستیار تولید']],['تصویربرداری',['مدیر فیلمبرداری','دستیار اول دوربین','گریپ و برق']],['صدا',['صدابردار','دستیار صدا','صداگذار']],['طراحی صحنه و لباس',['طراح صحنه','طراح لباس']],['گریم',[]],['تدوین و پس‌تولید',['تدوینگر','رنگ‌بند']],['بازیگران',[]]].forEach(([t,c])=>{const id=uid();P().crew.push({id,title:t,names:'',p:''});c.forEach(x=>P().crew.push({id:uid(),title:x,names:'',p:id}))})}
else if(a=='addi')get(i,()=>[]).push({from:'',to:'',title:'',loc:'',desc:'',st:'plan',res:''});
else if(a=='addw')get(i,()=>[]).push({day:+b.dataset.d,text:'',star:false,done:false});
else if(a=='addf')get('fin.'+i,()=>[]).push({title:'',desc:'',amt:''});
else if(a=='deli'){const k=i.split('.'),n=k.pop();get(k.join('.')).splice(n,1)}
else if(a=='star'){const k=i.split('.'),n=k.pop(),t=get(k.join('.'))[n];t.star=!t.star}
else if(a=='delm'){bx('del',i);P().media=P().media.filter(m=>m.id!=i)}
else return;save();render()});
document.addEventListener('change',async e=>{const t=e.target;
if(t.dataset.s){S[t.dataset.s]=t.value;return}
if(t.dataset.j){const q=k=>+document.querySelector(`[data-j=${k}]`).value;const y=q('y'),m=q('m'),dd=Math.min(Math.max(1,q('d')),mdays(y,m));S.date=iso(J(y,m,dd));return render()}
